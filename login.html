<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DMN 战队管理系统 - 登录</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b1426">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
            background: #e8ecf2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            background: radial-gradient(circle at 10% 20%, rgba(255,255,255,0.4) 0%, rgba(232,236,242,1) 80%);
        }
        .login-box {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            width: 100%;
            max-width: 400px;
            padding: 40px 28px 36px;
            border-radius: 36px;
            border: 0.5px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 30px 80px rgba(0,0,0,0.04), 0 0 0 0.5px rgba(0,0,0,0.02);
            transition: background 0.3s;
        }
        .login-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #0b1426;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .login-title span { color: #D4AF37; }
        .login-sub {
            text-align: center;
            font-size: 15px;
            color: #8e8e93;
            margin-bottom: 28px;
        }
        .item { margin-bottom: 16px; }
        .item input {
            width: 100%;
            height: 52px;
            padding: 0 18px;
            border: 1.5px solid rgba(0,0,0,0.04);
            border-radius: 18px;
            font-size: 16px;
            background: rgba(255,255,255,0.4);
            outline: none;
            color: #0b1426;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .item input:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.12);
            background: rgba(255,255,255,0.7);
        }
        .item input::placeholder { color: #b0b8c4; }
        .row-remember {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }
        .row-remember label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #4a4a5a;
            cursor: pointer;
        }
        .row-remember label input[type="checkbox"] {
            width: 18px; height: 18px;
            accent-color: #0b1426;
        }
        .row-remember .link-btn {
            background: none; border: none;
            color: #0b1426;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
        }
        .row-remember .link-btn:active { background: rgba(0,0,0,0.04); }
        .login-btn {
            width: 100%; height: 54px;
            background: #0b1426;
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
            box-shadow: 0 4px 20px rgba(11, 20, 38, 0.20);
        }
        .login-btn:active { transform: scale(0.97); opacity: 0.85; }
        .login-btn:disabled { opacity: 0.6; transform: none; box-shadow: none; }
        .err-text {
            color: #ea4335;
            text-align: left;
            margin-top: 14px;
            font-size: 14px;
            display: none;
            padding: 12px 14px;
            background: rgba(234,67,53,0.06);
            border-radius: 14px;
            border-left: 3px solid #ea4335;
        }
        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 15px;
            color: #6c6c70;
        }
        .register-link .link-btn {
            background: none; border: none;
            color: #0b1426;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
        }
        .register-link .link-btn:active { background: rgba(0,0,0,0.04); }
        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #b0b8c4;
        }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            width: 100%;
            max-width: 400px;
            border-radius: 36px;
            padding: 32px 24px 28px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.15);
            border: 0.5px solid rgba(255,255,255,0.5);
            animation: modalIn 0.35s ease;
        }
        @keyframes modalIn {
            from { opacity:0; transform:scale(0.92); }
            to { opacity:1; transform:scale(1); }
        }
        .modal-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #0b1426;
        }
        .modal-title span { color: #D4AF37; }
        .modal-sub {
            text-align: center;
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 20px;
        }
        .modal-box .item { margin-bottom: 14px; }
        .modal-box .item input {
            height: 48px;
            border-radius: 16px;
            background: rgba(255,255,255,0.4);
        }
        .modal-box .item input:focus { background: rgba(255,255,255,0.7); }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .modal-actions .btn-cancel {
            flex: 1;
            background: rgba(0,0,0,0.04);
            border: none;
            border-radius: 18px;
            height: 48px;
            font-size: 16px;
            font-weight: 500;
            color: #4a4a5a;
            cursor: pointer;
        }
        .modal-actions .btn-cancel:active { background: rgba(0,0,0,0.08); }
        .modal-actions .btn-register {
            flex: 2;
            background: #0b1426;
            border: none;
            border-radius: 18px;
            height: 48px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
        }
        .modal-actions .btn-register:active { opacity: 0.8; }
        .modal-err {
            color: #ea4335;
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* 暗色模式 */
        @media (prefers-color-scheme: dark) {
            body {
                background: #0b0e14;
                background: radial-gradient(circle at 10% 20%, #1a2430 0%, #0b0e14 80%);
            }
            .login-box {
                background: rgba(26, 42, 72, 0.75);
                border-color: rgba(255,255,255,0.05);
                box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            }
            .login-title { color: #f0f2f5; }
            .login-sub { color: #8e98a3; }
            .item input {
                background: rgba(255,255,255,0.05);
                border-color: rgba(255,255,255,0.08);
                color: #f0f2f5;
            }
            .item input:focus {
                border-color: #D4AF37;
                background: rgba(255,255,255,0.08);
            }
            .item input::placeholder { color: #6c7a8a; }
            .row-remember label { color: #b8c2cc; }
            .row-remember .link-btn { color: #D4AF37; }
            .login-btn {
                background: #D4AF37;
                color: #0b1426;
                box-shadow: 0 4px 20px rgba(212, 175, 55, 0.30);
            }
            .err-text { background: rgba(234,67,53,0.1); border-left-color: #ea4335; }
            .modal-box {
                background: rgba(26, 42, 72, 0.9);
                border-color: rgba(255,255,255,0.05);
            }
            .modal-title { color: #f0f2f5; }
            .modal-sub { color: #8e98a3; }
            .modal-box .item input {
                background: rgba(255,255,255,0.05);
                border-color: rgba(255,255,255,0.08);
                color: #f0f2f5;
            }
            .modal-box .item input:focus { background: rgba(255,255,255,0.08); }
            .btn-cancel {
                background: rgba(255,255,255,0.06);
                color: #b8c2cc;
            }
            .btn-cancel:active { background: rgba(255,255,255,0.1); }
            .modal-actions .btn-register {
                background: #D4AF37;
                color: #0b1426;
            }
            .register-link { color: #8e98a3; }
            .register-link .link-btn { color: #D4AF37; }
            .footer-note { color: #6c7a8a; }
        }
        @media (max-width: 420px) {
            .login-box { padding: 32px 20px 28px; }
            .login-title { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-title">DMN<span>电竞</span></div>
        <div class="login-sub">战队管理系统 · 登录</div>
        <div class="item"><input type="text" id="username" placeholder="游戏名称" autocomplete="username"></div>
        <div class="item"><input type="password" id="password" placeholder="密码" autocomplete="current-password"></div>
        <div class="row-remember">
            <label><input type="checkbox" id="rememberMe"> 记住登录</label>
            <button class="link-btn" onclick="alert('请联系管理员重置密码')">忘记密码?</button>
        </div>
        <button class="login-btn" id="loginBtn" onclick="handleLogin()">登 录</button>
        <div class="err-text" id="loginError"></div>
        <div class="register-link">
            还没有账号？<button class="link-btn" onclick="openRegisterModal()">立即注册</button>
        </div>
        <div class="footer-note">DMN 战队管理系统 · 让每一场战斗都被铭记</div>
    </div>

    <div class="modal-overlay" id="registerModal">
        <div class="modal-box">
            <div class="modal-title">创建<span>账号</span></div>
            <div class="modal-sub">加入 DMN 公会，参与赛事</div>
            <div class="item"><input type="text" id="regUsername" placeholder="游戏名称"></div>
            <div class="item"><input type="password" id="regPassword" placeholder="密码（至少6位）"></div>
            <div class="item"><input type="password" id="regPasswordConfirm" placeholder="确认密码"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeRegisterModal()">取消</button>
                <button class="btn-register" id="registerBtn" onclick="handleRegister()">注册</button>
            </div>
            <div class="modal-err" id="registerError"></div>
        </div>
    </div>

    <script>
        function storeUserInfo(username, role) {
            localStorage.setItem('dmn_user', username);
            localStorage.setItem('dmn_role', role || '队员');
        }

        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                errorEl.style.display = 'block';
                errorEl.textContent = '请输入游戏名称和密码';
                return;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';
            errorEl.style.display = 'none';

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', username, password })
                });
                const data = await response.json();
                if (!response.ok || !data.token) {
                    throw new Error(data.msg || '登录失败，请检查游戏名称和密码');
                }
                localStorage.setItem('dmn_token', data.token);
                storeUserInfo(username, data.role);
                if (document.getElementById('rememberMe').checked) {
                    localStorage.setItem('dmn_remember', 'true');
                }
                window.location.href = '/';
            } catch (err) {
                errorEl.style.display = 'block';
                errorEl.textContent = err.message || '网络错误，请稍后重试';
            } finally {
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        }

        document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

        function openRegisterModal() {
            document.getElementById('registerModal').classList.add('show');
            document.getElementById('registerError').style.display = 'none';
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regPasswordConfirm').value = '';
        }
        function closeRegisterModal() {
            document.getElementById('registerModal').classList.remove('show');
        }

        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;
            const errorEl = document.getElementById('registerError');
            const btn = document.getElementById('registerBtn');

            if (!username || !password) {
                errorEl.style.display = 'block';
                errorEl.textContent = '请填写所有字段';
                return;
            }
            if (password !== confirm) {
                errorEl.style.display = 'block';
                errorEl.textContent = '两次密码输入不一致';
                return;
            }
            if (password.length < 6) {
                errorEl.style.display = 'block';
                errorEl.textContent = '密码至少需要6位';
                return;
            }

            btn.disabled = true;
            btn.textContent = '注册中...';
            errorEl.style.display = 'none';

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'register', username, password })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.msg || '注册失败，请稍后重试');
                }
                if (data.token) {
                    localStorage.setItem('dmn_token', data.token);
                    storeUserInfo(username, data.role || '队员');
                    window.location.href = '/';
                } else {
                    alert(data.msg || '注册成功，请登录');
                    closeRegisterModal();
                }
            } catch (err) {
                errorEl.style.display = 'block';
                errorEl.textContent = err.message || '网络错误';
            } finally {
                btn.disabled = false;
                btn.textContent = '注册';
            }
        }

        document.getElementById('registerModal').addEventListener('click', function(e) {
            if (e.target === this) closeRegisterModal();
        });
    </script>
</body>
</html>
