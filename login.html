<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DMN 战队管理系统 - 登录</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a2a48">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", system-ui, sans-serif; }
        body { background:#f5f7fa; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .login-box { background:#ffffff; width:100%; max-width:400px; padding:40px 28px 36px; border-radius:24px; box-shadow:0 8px 40px rgba(0,0,0,0.06); }
        .login-title { text-align:center; font-size:26px; font-weight:700; color:#1a2a48; margin-bottom:4px; }
        .login-title span { color:#c9a84c; }
        .login-sub { text-align:center; font-size:14px; color:#8e98a3; margin-bottom:28px; }
        .item { margin-bottom:16px; }
        .item input { width:100%; height:50px; padding:0 16px; border:1.5px solid #eef0f4; border-radius:14px; font-size:16px; background:#fafbfc; outline:none; color:#1a1a2e; transition:border-color 0.2s; }
        .item input:focus { border-color:#c9a84c; box-shadow:0 0 0 4px rgba(201,168,76,0.12); background:#ffffff; }
        .item input::placeholder { color:#b0b8c4; }
        .row-remember { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .row-remember label { display:flex; align-items:center; gap:6px; font-size:14px; color:#4a4a5a; cursor:pointer; }
        .row-remember label input[type="checkbox"] { width:18px; height:18px; accent-color:#1a2a48; cursor:pointer; }
        .row-remember .link-btn { background:none; border:none; color:#1a2a48; font-size:14px; font-weight:500; cursor:pointer; text-decoration:underline; }
        .row-remember .link-btn:active { opacity:0.6; }
        .login-btn { width:100%; height:52px; background:#1a2a48; border:none; border-radius:14px; color:white; font-size:17px; font-weight:600; cursor:pointer; transition:0.2s; margin-top:4px; box-shadow:0 4px 14px rgba(26,42,72,0.20); }
        .login-btn:active { transform:scale(0.97); opacity:0.85; }
        .login-btn:disabled { opacity:0.6; transform:none; }
        .err-text { color:#ea4335; text-align:left; margin-top:14px; font-size:14px; display:none; padding:10px 12px; background:#fef0ef; border-radius:10px; word-break:break-all; }
        .footer-note { text-align:center; margin-top:20px; font-size:12px; color:#b0b8c4; }

        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:999; padding:20px; }
        .modal-overlay.show { display:flex; }
        .modal-box { background:#fff; width:100%; max-width:400px; border-radius:24px; padding:32px 24px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.3); animation:modalIn 0.3s ease; }
        @keyframes modalIn { from { transform:scale(0.9); opacity:0; } to { transform:scale(1); opacity:1; } }
        .modal-title { text-align:center; font-size:22px; font-weight:700; color:#1a2a48; margin-bottom:6px; }
        .modal-title span { color:#c9a84c; }
        .modal-sub { text-align:center; font-size:13px; color:#8e98a3; margin-bottom:20px; }
        .modal-box .item { margin-bottom:14px; }
        .modal-box .item input { height:46px; border-radius:12px; }
        .modal-actions { display:flex; gap:12px; margin-top:8px; }
        .modal-actions .btn-cancel { flex:1; background:#f0f2f5; border:none; border-radius:12px; height:48px; font-size:16px; font-weight:500; color:#4a4a5a; cursor:pointer; }
        .modal-actions .btn-cancel:active { background:#e4e6ea; }
        .modal-actions .btn-register { flex:2; background:#1a2a48; border:none; border-radius:12px; height:48px; font-size:16px; font-weight:600; color:#fff; cursor:pointer; }
        .modal-actions .btn-register:active { opacity:0.8; }
        .modal-err { color:#ea4335; text-align:center; font-size:13px; margin-top:10px; display:none; }

        @media (prefers-color-scheme: dark) {
            body { background:#0f1419; }
            .login-box { background:#1a2430; box-shadow:0 8px 32px rgba(0,0,0,0.4); }
            .login-title { color:#f0f2f5; }
            .login-sub { color:#8e98a3; }
            .item input { background:#111a24; border-color:#2a3342; color:#f0f2f5; }
            .item input:focus { border-color:#c9a84c; background:#1a2430; }
            .row-remember label { color:#b8c2cc; }
            .row-remember .link-btn { color:#c9a84c; }
            .login-btn { background:#c9a84c; color:#1a1a2e; box-shadow:0 4px 14px rgba(201,168,76,0.30); }
            .modal-box { background:#1a2430; color:#f0f2f5; }
            .modal-title { color:#f0f2f5; }
            .modal-sub { color:#8e98a3; }
            .modal-box .item input { background:#111a24; border-color:#2a3342; color:#f0f2f5; }
            .btn-cancel { background:#2a3342; color:#b8c2cc; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-title">DMN<span>电竞</span></div>
        <div class="login-sub">战队管理系统 · 登录</div>

        <!-- 登录表单 -->
        <div class="item">
            <input type="text" id="username" placeholder="用户名 / 邮箱" autocomplete="username">
        </div>
        <div class="item">
            <input type="password" id="password" placeholder="密码" autocomplete="current-password">
        </div>
        <div class="row-remember">
            <label>
                <input type="checkbox" id="rememberMe"> 记住登录
            </label>
            <button class="link-btn" type="button" onclick="alert('请联系管理员重置密码')">忘记密码?</button>
        </div>
        <button class="login-btn" id="loginBtn" onclick="handleLogin()">登 录</button>
        <div class="err-text" id="loginError"></div>

        <div style="text-align:center; margin-top:24px; font-size:14px; color:#6b7280;">
            还没有账号？
            <button class="link-btn" type="button" onclick="openRegisterModal()" style="font-size:14px;">立即注册</button>
        </div>
        <div class="footer-note">DMN 战队管理系统 · 让每一场战斗都被铭记</div>
    </div>

    <!-- 注册模态框 -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal-box">
            <div class="modal-title">创建<span>账号</span></div>
            <div class="modal-sub">加入 DMN 公会，参与赛事</div>
            <div class="item">
                <input type="text" id="regUsername" placeholder="用户名">
            </div>
            <div class="item">
                <input type="email" id="regEmail" placeholder="邮箱地址">
            </div>
            <div class="item">
                <input type="password" id="regPassword" placeholder="密码（至少6位）">
            </div>
            <div class="item">
                <input type="password" id="regPasswordConfirm" placeholder="确认密码">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeRegisterModal()">取消</button>
                <button class="btn-register" id="registerBtn" onclick="handleRegister()">注册</button>
            </div>
            <div class="modal-err" id="registerError"></div>
        </div>
    </div>

    <script>
        // ========== 登录处理 ==========
        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                errorEl.style.display = 'block';
                errorEl.textContent = '请输入用户名和密码';
                return;
            }

            // 禁用按钮防止重复提交
            btn.disabled = true;
            btn.textContent = '登录中...';
            errorEl.style.display = 'none';

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok || !data.token) {
                    throw new Error(data.message || '登录失败，请检查用户名和密码');
                }

                // ✅ 登录成功：存储 token
                localStorage.setItem('dmn_token', data.token);

                // 如果勾选了“记住登录”，也可以存一个标记（可选）
                if (document.getElementById('rememberMe').checked) {
                    localStorage.setItem('dmn_remember', 'true');
                }

                // ✅ 跳转到首页
                window.location.href = '/';

            } catch (err) {
                errorEl.style.display = 'block';
                errorEl.textContent = err.message || '网络错误，请稍后重试';
            } finally {
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        }

        // 回车键快捷登录
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });

        // ========== 注册处理 ==========
        function openRegisterModal() {
            document.getElementById('registerModal').classList.add('show');
            document.getElementById('registerError').style.display = 'none';
        }

        function closeRegisterModal() {
            document.getElementById('registerModal').classList.remove('show');
        }

        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;
            const errorEl = document.getElementById('registerError');
            const btn = document.getElementById('registerBtn');

            // 简单校验
            if (!username || !email || !password) {
                errorEl.style.display = 'block';
                errorEl.textContent = '请填写所有字段';
                return;
            }
            if (password !== passwordConfirm) {
                errorEl.style.display = 'block';
                errorEl.textContent = '两次密码输入不一致';
                return;
            }
            if (password.length < 6) {
                errorEl.style.display = 'block';
                errorEl.textContent = '密码至少需要6位';
                return;
            }

            btn.disabled = true;
            btn.textContent = '注册中...';
            errorEl.style.display = 'none';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || '注册失败，请稍后重试');
                }

                // 注册成功：自动登录（如果后端返回 token）或提示用户
                if (data.token) {
                    localStorage.setItem('dmn_token', data.token);
                    window.location.href = '/';
                } else {
                    alert('注册成功，请登录');
                    closeRegisterModal();
                }

            } catch (err) {
                errorEl.style.display = 'block';
                errorEl.textContent = err.message || '网络错误';
            } finally {
                btn.disabled = false;
                btn.textContent = '注册';
            }
        }

        // 点击模态框外部关闭
        document.getElementById('registerModal').addEventListener('click', function(e) {
            if (e.target === this) closeRegisterModal();
        });
    </script>
</body>
</html>
