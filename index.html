<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>D.M.N 战队管理系统</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a2a48">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",system-ui,sans-serif}
        body{background:#f5f7fa;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
        .login-box{background:#fff;width:100%;max-width:400px;padding:40px 28px 36px;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,0.06)}
        .login-title{text-align:center;font-size:26px;font-weight:700;color:#1a2a48;margin-bottom:4px}
        .login-title span{color:#c9a84c}
        .login-sub{text-align:center;font-size:14px;color:#8e98a3;margin-bottom:28px}
        .item{margin-bottom:16px}
        .item input{width:100%;height:50px;padding:0 16px;border:1.5px solid #eef0f4;border-radius:14px;font-size:16px;background:#fafbfc;outline:none;color:#1a1a2e;transition:border-color .2s}
        .item input:focus{border-color:#c9a84c;box-shadow:0 0 0 4px rgba(201,168,76,0.12);background:#fff}
        .item input::placeholder{color:#b0b8c4}
        .row-remember{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .row-remember label{display:flex;align-items:center;gap:6px;font-size:14px;color:#4a4a5a;cursor:pointer}
        .row-remember label input[type=checkbox]{width:18px;height:18px;accent-color:#1a2a48;cursor:pointer}
        .row-remember .link-btn{background:none;border:none;color:#1a2a48;font-size:14px;font-weight:500;cursor:pointer;text-decoration:underline}
        .row-remember .link-btn:active{opacity:.6}
        .login-btn{width:100%;height:52px;background:#1a2a48;border:none;border-radius:14px;color:#fff;font-size:17px;font-weight:600;cursor:pointer;transition:.2s;margin-top:4px;box-shadow:0 4px 14px rgba(26,42,72,0.20)}
        .login-btn:active{transform:scale(.97);opacity:.85}
        .login-btn:disabled{opacity:.6;transform:none}
        .err-text{color:#ea4335;text-align:center;margin-top:14px;font-size:14px;display:none;padding:10px 12px;background:#fef0ef;border-radius:10px}
        .footer-note{text-align:center;margin-top:20px;font-size:12px;color:#b0b8c4}
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:999;padding:20px}
        .modal-overlay.show{display:flex}
        .modal-box{background:#fff;width:100%;max-width:400px;border-radius:24px;padding:32px 24px 28px;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:modalIn .3s ease}
        @keyframes modalIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
        .modal-title{text-align:center;font-size:22px;font-weight:700;color:#1a2a48;margin-bottom:6px}
        .modal-title span{color:#c9a84c}
        .modal-sub{text-align:center;font-size:13px;color:#8e98a3;margin-bottom:20px}
        .modal-box .item{margin-bottom:14px}
        .modal-box .item input{height:46px;border-radius:12px}
        .modal-actions{display:flex;gap:12px;margin-top:8px}
        .modal-actions .btn-cancel{flex:1;background:#f0f2f5;border:none;border-radius:12px;height:48px;font-size:16px;font-weight:500;color:#4a4a5a;cursor:pointer}
        .modal-actions .btn-cancel:active{background:#e4e6ea}
        .modal-actions .btn-register{flex:2;background:#1a2a48;border:none;border-radius:12px;height:48px;font-size:16px;font-weight:600;color:#fff;cursor:pointer}
        .modal-actions .btn-register:active{opacity:.8}
        .modal-err{color:#ea4335;text-align:center;font-size:13px;margin-top:10px;display:none}
        @media(prefers-color-scheme:dark){body{background:#0f1419}.login-box{background:#1a2430;box-shadow:0 8px 32px rgba(0,0,0,0.4)}.login-title{color:#f0f2f5}.login-sub{color:#8e98a3}.item input{background:#111a24;border-color:#2a3342;color:#f0f2f5}.item input:focus{border-color:#c9a84c;background:#1a2430}.row-remember label{color:#b8c2cc}.row-remember .link-btn{color:#c9a84c}.login-btn{background:#c9a84c;color:#1a1a2e;box-shadow:0 4px 14px rgba(201,168,76,0.30)}.err-text{background:#3d1a1a;color:#f5a0a0}.footer-note{color:#6e7a8a}.modal-overlay{background:rgba(0,0,0,0.7)}.modal-box{background:#1a2430}.modal-title{color:#f0f2f5}.modal-sub{color:#8e98a3}.modal-box .item input{background:#111a24;border-color:#2a3342;color:#f0f2f5}.modal-box .item input:focus{border-color:#c9a84c;background:#1a2430}.modal-actions .btn-cancel{background:#2a3342;color:#b8c2cc}.modal-actions .btn-cancel:active{background:#3a4352}.modal-actions .btn-register{background:#c9a84c;color:#1a1a2e}.modal-err{color:#f5a0a0}}
    </style>
</head>
<body>

<div class="login-box">
    <div class="login-title">D.<span>M</span>.N</div>
    <div class="login-sub">战队管理系统 · 队员登录</div>
    <div class="item">
        <input type="text" id="username" placeholder="请输入游戏名称" autocomplete="username">
    </div>
    <div class="item">
        <input type="password" id="pwd" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <div class="row-remember">
        <label><input type="checkbox" id="rememberMe"> 记住账号</label>
        <button class="link-btn" id="showRegisterBtn">注册新账号 →</button>
    </div>
    <button class="login-btn" id="submitBtn">立即登录</button>
    <div class="err-text" id="errorMsg"></div>
    <div class="footer-note">使用 Cloudflare Pages 安全托管</div>
</div>

<div class="modal-overlay" id="registerModal">
    <div class="modal-box">
        <div class="modal-title">D.<span>M</span>.N</div>
        <div class="modal-sub">注册新账号</div>
        <div class="item"><input type="text" id="regUsername" placeholder="请输入游戏名称"></div>
        <div class="item"><input type="password" id="regPwd" placeholder="请输入密码"></div>
        <div class="item"><input type="password" id="regPwd2" placeholder="确认密码"></div>
        <div class="modal-err" id="regErrorMsg"></div>
        <div class="modal-actions">
            <button class="btn-cancel" id="closeRegisterBtn">取消</button>
            <button class="btn-register" id="registerBtn">立即注册</button>
        </div>
    </div>
</div>

<script>
    var usernameInput=document.getElementById('username');
    var pwdInput=document.getElementById('pwd');
    var submitBtn=document.getElementById('submitBtn');
    var errorMsg=document.getElementById('errorMsg');
    var rememberMe=document.getElementById('rememberMe');
    var registerModal=document.getElementById('registerModal');
    var showRegisterBtn=document.getElementById('showRegisterBtn');
    var closeRegisterBtn=document.getElementById('closeRegisterBtn');
    var registerBtn=document.getElementById('registerBtn');
    var regUsername=document.getElementById('regUsername');
    var regPwd=document.getElementById('regPwd');
    var regPwd2=document.getElementById('regPwd2');
    var regErrorMsg=document.getElementById('regErrorMsg');

    (function(){var saved=localStorage.getItem('rememberedUser');if(saved){try{var data=JSON.parse(saved);usernameInput.value=data.username||'';pwdInput.value=data.password||'';rememberMe.checked=true;}catch(e){}}})();

    submitBtn.addEventListener('click',loginSubmit);
    document.addEventListener('keydown',function(e){if(e.key==='Enter')loginSubmit();});

    async function loginSubmit(){
        var username=usernameInput.value.trim();
        var password=pwdInput.value.trim();
        errorMsg.style.display='none';
        errorMsg.style.color='#ea4335';
        errorMsg.style.background='#fef0ef';
        if(!username||!password){showErr('账号密码不能为空');return;}
        try{
            submitBtn.textContent='登录中...';
            submitBtn.disabled=true;
            var res=await fetch('/api/auth',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({action:'login',username:username,password:password})
            });
            var rawText=await res.text();
            var data;
            try{data=JSON.parse(rawText);}catch(e){showErr('服务器返回非JSON (状态码:'+res.status+') 内容:'+rawText.substring(0,100));return;}
            if(res.ok&&data.ok){
                if(rememberMe.checked){localStorage.setItem('rememberedUser',JSON.stringify({username:username,password:password}));}
                else{localStorage.removeItem('rememberedUser');}
                localStorage.setItem('loginUser',username);
                localStorage.setItem('userRole',data.role||'队员');
                localStorage.setItem('token',data.token||'');
                window.location.href='member.html';
            }else{var msg=data.msg||data.error||'未知错误';showErr('['+res.status+'] '+msg);}
        }catch(err){showErr('网络请求异常:'+(err.message||'未知错误'));console.error(err);}
        finally{submitBtn.textContent='立即登录';submitBtn.disabled=false;}
    }

    function showErr(text){errorMsg.innerText=text;errorMsg.style.display='block';}

    showRegisterBtn.addEventListener('click',function(){registerModal.classList.add('show');regUsername.value='';regPwd.value='';regPwd2.value='';regErrorMsg.style.display='none';regUsername.focus();});
    closeRegisterBtn.addEventListener('click',function(){registerModal.classList.remove('show');});
    registerModal.addEventListener('click',function(e){if(e.target===registerModal)registerModal.classList.remove('show');});
    registerBtn.addEventListener('click',registerSubmit);
    document.addEventListener('keydown',function(e){if(e.key==='Enter'&&registerModal.classList.contains('show')){registerSubmit();}});

    async function registerSubmit(){
        var username=regUsername.value.trim();
        var password=regPwd.value.trim();
        var password2=regPwd2.value.trim();
        regErrorMsg.style.display='none';
        if(!username){showRegErr('请输入游戏名称');return;}
        if(username.length<2){showRegErr('游戏名称至少2个字符');return;}
        if(!password){showRegErr('请输入密码');return;}
        if(password.length<4){showRegErr('密码至少4个字符');return;}
        if(password!==password2){showRegErr('两次密码输入不一致');return;}
        try{
            registerBtn.textContent='注册中...';
            registerBtn.disabled=true;
            var res=await fetch('/api/auth',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({action:'register',username:username,password:password})
            });
            var data=await res.json();
            if(res.ok&&data.ok){
                regErrorMsg.style.display='none';
                registerModal.classList.remove('show');
                usernameInput.value=username;
                pwdInput.value=password;
                rememberMe.checked=true;
                errorMsg.style.display='block';
                errorMsg.style.color='#0f9d58';
                errorMsg.style.background='#e6f7ed';
                errorMsg.innerText='注册成功！请点击登录';
                setTimeout(function(){errorMsg.style.display='none';errorMsg.style.color='#ea4335';errorMsg.style.background='#fef0ef';},4000);
            }else{showRegErr(data.msg||'注册失败');}
        }catch(err){showRegErr('网络请求失败，请稍后重试');console.error(err);}
        finally{registerBtn.textContent='立即注册';registerBtn.disabled=false;}
    }

    function showRegErr(text){regErrorMsg.innerText=text;regErrorMsg.style.display='block';}

    if('serviceWorker' in navigator){navigator.serviceWorker.register('/service-worker.js').catch(function(err){console.warn('SW注册失败',err);});}
</script>

</body>
</html>
