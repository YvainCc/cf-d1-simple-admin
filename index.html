<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>D.M.N 战队管理系统</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a2a48">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", system-ui, sans-serif; }
        body { background:#f2f4f8; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .login-box { background:#ffffff; width:100%; max-width:400px; padding:40px 28px 36px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
        .login-title { text-align:center; font-size:26px; font-weight:700; color:#1a2a48; margin-bottom:4px; letter-spacing:0.5px; }
        .login-title span { color:#c9a84c; }
        .login-sub { text-align:center; font-size:14px; color:#8e98a3; margin-bottom:32px; }
        .item { margin-bottom:16px; }
        .item input { width:100%; height:50px; padding:0 16px; border:1.5px solid #eef0f4; border-radius:14px; font-size:16px; background:#fafbfc; transition:border-color 0.2s, box-shadow 0.2s; outline:none; color:#1a1a2e; }
        .item input:focus { border-color:#c9a84c; box-shadow:0 0 0 4px rgba(201,168,76,0.12); background:#ffffff; }
        .item input::placeholder { color:#b0b8c4; }
        .remember-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; font-size:14px; }
        .remember-row label { display:flex; align-items:center; gap:8px; color:#4a4a5a; cursor:pointer; }
        .remember-row input[type="checkbox"] { width:18px; height:18px; accent-color:#c9a84c; cursor:pointer; }
        .register-link { color:#c9a84c; text-decoration:none; font-weight:500; }
        .login-btn { width:100%; height:52px; background:#1a2a48; border:none; border-radius:14px; color:white; font-size:17px; font-weight:600; cursor:pointer; transition:0.2s; margin-top:4px; box-shadow:0 4px 14px rgba(26,42,72,0.20); }
        .login-btn:active { transform:scale(0.97); opacity:0.85; }
        .login-btn:disabled { opacity:0.6; cursor:not-allowed; }
        .err-text { color:#ea4335; text-align:center; margin-top:14px; font-size:14px; display:none; padding:8px 12px; background:#fef0ef; border-radius:10px; }
        .footer-note { text-align:center; margin-top:24px; font-size:12px; color:#b0b8c4; }
        @media (prefers-color-scheme: dark) {
            body { background:#0f1419; }
            .login-box { background:#1a2430; box-shadow:0 2px 8px rgba(0,0,0,0.4); }
            .login-title { color:#f0f2f5; }
            .login-sub { color:#8e98a3; }
            .item input { background:#111a24; border-color:#2a3342; color:#f0f2f5; }
            .item input:focus { border-color:#c9a84c; background:#1a2430; }
            .login-btn { background:#c9a84c; color:#1a1a2e; box-shadow:0 4px 14px rgba(201,168,76,0.30); }
            .remember-row label { color:#b8c2cc; }
            .err-text { background:#3d1a1a; color:#f5a0a0; }
            .footer-note { color:#6e7a8a; }
        }
    </style>
</head>
<body>
<div class="login-box">
    <div class="login-title">D.<span>M</span>.N</div>
    <div class="login-sub">战队管理系统 · 队员登录</div>
    <div class="item"><input type="text" id="username" placeholder="请输入游戏名称" autocomplete="username"></div>
    <div class="item"><input type="password" id="pwd" placeholder="请输入密码" autocomplete="current-password"></div>
    <div class="remember-row">
        <label><input type="checkbox" id="rememberCheck"> 记住账号密码</label>
        <a href="register.html" class="register-link">没有账号？立即注册</a>
    </div>
    <button class="login-btn" id="submitBtn">立即登录</button>
    <div class="err-text" id="errorMsg"></div>
    <div class="footer-note">使用 Cloudflare Pages 安全托管</div>
</div>
<script>
    const usernameInput = document.getElementById('username');
    const pwdInput = document.getElementById('pwd');
    const rememberCheck = document.getElementById('rememberCheck');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    // 自动填充记住的账号
    const savedUser = localStorage.getItem('savedUsername');
    const savedPwd = localStorage.getItem('savedPassword');
    const rememberMe = localStorage.getItem('rememberMe') === 'true';
    if (rememberMe && savedUser && savedPwd) {
        usernameInput.value = savedUser;
        pwdInput.value = savedPwd;
        rememberCheck.checked = true;
    }

    submitBtn.addEventListener('click', loginSubmit);
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginSubmit(); });

    async function loginSubmit() {
        const username = usernameInput.value.trim();
        const password = pwdInput.value.trim();
        errorMsg.style.display = 'none';

        if (!username || !password) {
            showErr('账号密码不能为空');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '登录中...';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (data.ok) {
                // 记住密码
                if (rememberCheck.checked) {
                    localStorage.setItem('savedUsername', username);
                    localStorage.setItem('savedPassword', password);
                    localStorage.setItem('rememberMe', 'true');
                } else {
                    localStorage.removeItem('savedUsername');
                    localStorage.removeItem('savedPassword');
                    localStorage.removeItem('rememberMe');
                }

                // 保存登录状态
                localStorage.setItem('token', data.token);
                localStorage.setItem('loginUser', data.username);
                localStorage.setItem('userRole', data.role);

                window.location.href = 'member.html';
            } else {
                showErr(data.msg || '登录失败，请检查账号密码');
                submitBtn.disabled = false;
                submitBtn.textContent = '立即登录';
            }
        } catch (err) {
            showErr('网络请求失败，请稍后重试');
            console.error(err);
            submitBtn.disabled = false;
            submitBtn.textContent = '立即登录';
        }
    }

    function showErr(text) {
        errorMsg.innerText = text;
        errorMsg.style.display = 'block';
    }

    // PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js')
            .then(() => console.log('✅ SW 注册成功'))
            .catch(err => console.warn('⚠️ SW 注册失败', err));
    }
</script>
</body>
</html>
