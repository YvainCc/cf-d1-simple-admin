<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.M.N 战队管理系统-登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: #fff;
            width: 420px;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px #e0e4ec;
        }
        .login-title {
            text-align: center;
            font-size: 24px;
            color: #222;
            margin-bottom: 30px;
        }
        .item {
            margin-bottom: 20px;
        }
        .item input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            font-size: 16px;
        }
        .login-btn {
            width: 100%;
            height: 48px;
            background: #3b88f7;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }
        .login-btn:active {
            background: #2e77dd;
        }
        .err-text {
            color: #f53f3f;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2 class="login-title">D.M.N 战队管理系统登录</h2>
    <div class="item">
        <input type="text" id="username" placeholder="请输入账号">
    </div>
    <div class="item">
        <input type="password" id="pwd" placeholder="请输入密码">
    </div>
    <button class="login-btn" id="submitBtn">立即登录</button>
    <div class="err-text" id="errorMsg"></div>
</div>
<script>
const usernameInput = document.getElementById('username');
const pwdInput = document.getElementById('pwd');
const submitBtn = document.getElementById('submitBtn');
const errorMsg = document.getElementById('errorMsg');

submitBtn.addEventListener('click', loginSubmit);
document.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') loginSubmit();
})

async function loginSubmit() {
    const username = usernameInput.value.trim();
    const password = pwdInput.value.trim();
    errorMsg.style.display = 'none';
    if (!username || !password) {
        showErr('账号密码不能为空');
        return;
    }
    try {
        // 接口地址更正为 /api/login.js
        const res = await fetch('/api/login.js', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                action: "login",
                username: username,
                password: password
            })
        })
        const data = await res.json();
        if (data.ok) {
            // 三个存储键名和member.html完全对齐
            localStorage.setItem("loginToken", data.token);
            localStorage.setItem("loginUser", username);
            localStorage.setItem("loginRole", data.role);
            // 携带随机时间戳跳转，防止308缓存
            window.location.assign('member.html?_t=' + Date.now());
        } else {
            showErr(data.msg);
        }
    } catch (err) {
        showErr('网络请求失败，请稍后重试');
        console.error(err);
    }
}
function showErr(text) {
    errorMsg.innerText = text;
    errorMsg.style.display = 'block';
}
</script>
</body>
</html>
