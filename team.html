<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的战队 | D.M.N</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0f1419;
            color: #f0f2f5;
        }
        header {
            background: linear-gradient(135deg, #1a2a48 0%, #0f1419 100%);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3342;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffd700;
        }
        .nav-links {
            display: flex;
            gap: 24px;
        }
        .nav-links a {
            color: #b8c2cc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-links a:hover,.nav-links a.active {
            color: #ffd700;
        }
        .logout {
            color: #ff5555;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 16px;
        }
        .panel {
            background: #1a2430;
            border: 1px solid #2a3342;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .panel h3 {
            font-size: 20px;
            margin-bottom: 18px;
            color: #fff;
        }
        .btn {
            display: inline-block;
            background: #ffd700;
            color: #0f1419;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            margin-right: 12px;
            margin-bottom: 12px;
            border:0;
            cursor:pointer;
        }
        .btn:hover {
            background: #ffed4e;
        }
        .btn-secondary {
            background: #2a3342;
            color: #f0f2f5;
        }
        .btn-secondary:hover {
            background: #353f52;
        }
        .btn-small{
            padding:6px 10px;
            font-size:12px;
            margin:0 4px;
        }
        .empty {
            color: #7d8898;
            padding: 30px 0;
            text-align: center;
            font-size: 14px;
        }
        .input-box{
            width:100%;
            max-width:320px;
            height:46px;
            padding:0 14px;
            background:#222d3b;
            border:1px solid #353f52;
            border-radius:8px;
            color:#fff;
            font-size:16px;
            margin:12px 0;
        }
        .team-slot-wrap{
            display:grid;
            grid-template-columns: repeat(4,1fr);
            gap:12px;
            margin:20px 0;
        }
        .slot{
            background:#222d3b;
            border:1px dashed #6e7888;
            border-radius:8px;
            padding:20px 10px;
            text-align:center;
            color:#8b95a5;
        }
        .slot.starter{
            border-color:#ffd700;
        }
        .tax-tip{
            padding:12px;
            border-radius:8px;
            margin:16px 0;
        }
        .tax-yes{
            background:#602828;
            border:1px solid #ff5555;
            color:#ffbbbb;
        }
        .tax-no{
            background:#204030;
            border:1px solid #4cd988;
            color:#b8ffd0;
        }
        @media (max-width:600px){
            header{flex-direction:column;gap:12px}
            .nav-links{gap:10px;flex-wrap:wrap;justify-content:center}
            .team-slot-wrap{grid-template-columns: repeat(2,1fr)}
        }
    </style>
</head>
<body>
<header>
    <div class="logo">D.M.N</div>
    <nav class="nav-links">
        <a href="member.html">队员中心</a>
        <a href="ranks.html">排行榜</a>
        <a href="team.html" class="active">我的战队</a>
        <a href="#">比赛回放</a>
        <a href="#">赞助公示</a>
    </nav>
    <div class="logout" onclick="logout()">退出登录</div>
</header>
<div class="container">
    <div class="panel" id="joinPanel">
        <h3>暂无战队</h3>
        <p style="color:#b8c2cc;margin-bottom:16px;">你当前未加入任何DMN赛事战队，可创建新战队或输入邀请码加入已有战队</p>
        <input class="input-box" id="inviteCode" placeholder="输入战队6位邀请码">
        <button class="btn" id="joinBtn">加入战队</button>
        <button class="btn btn-secondary" id="createTeamBtn">创建新战队</button>
    </div>

    <div class="panel" id="teamMainPanel" style="display:none;">
        <h3 id="teamTitle"></h3>
        <div id="taxTipBox" class="tax-tip"></div>
        <h4 style="margin:16px 0 8px;color:#ffd700;">首发阵容（最多4人，计入奢侈税计算）</h4>
        <div class="team-slot-wrap" id="starterWrap"></div>
        <h4 style="margin:24px 0 8px;color:#ffd700;">替补阵容</h4>
        <div class="team-slot-wrap" id="subWrap"></div>
    </div>

    <div class="panel">
        <h3>战队编制说明</h3>
        <p style="color:#b8c2cc;line-height:1.7;">单战队最多9人：1队长 + 4首发（计算奢侈税）+ 4替补</p>
        <p style="color:#b8c2cc;line-height:1.7;margin-top:8px;">首发四人KD总和超过4.5，自动计算奢侈税，提交报名后方可参赛</p>
        <div class="team-slot-wrap">
            <div class="slot starter">首发位1</div>
            <div class="slot starter">首发位2</div>
            <div class="slot starter">首发位3</div>
            <div class="slot starter">首发位4</div>
        </div>
        <div class="team-slot-wrap">
            <div class="slot">替补1</div>
            <div class="slot">替补2</div>
            <div class="slot">替补3</div>
            <div class="slot">替补4</div>
        </div>
    </div>
    <div class="panel">
        <h3>赛季报名进度</h3>
        <div class="empty">当前赛季报名通道未开启/你未提交战队报名</div>
    </div>
</div>
<script>
// 全局登录账号，后续登录页改造存入localStorage
const loginUserName = "player01";
let currentTeamId = "";
let isCaptain = false;

function logout(){
    window.location.href="index.html"
}

// 页面加载拉取战队基础信息
window.onload = async function(){
    const res = await fetch(`/api/team?username=${loginUserName}`);
    const data = await res.json();
    if(data.ok && data.hasTeam){
        // 隐藏加入面板，展示战队详情
        document.getElementById("joinPanel").style.display = "none";
        document.getElementById("teamMainPanel").style.display = "block";
        currentTeamId = data.teamInfo.id;
        isCaptain = data.selfRole === "captain";
        document.getElementById("teamTitle").innerText = `战队：${data.teamInfo.name} | 邀请码：${data.teamInfo.inviteCode}`;
        loadTeamLineup();
    }
}

// 加载阵容、计算总KD奢侈税
async function loadTeamLineup(){
    const res = await fetch(`/api/teamManage?teamId=${currentTeamId}`);
    const json = await res.json();
    if(!json.ok) return;
    const tData = json.teamData;
    // 奢侈税提示
    const tipBox = document.getElementById("taxTipBox");
    if(tData.needLuxuryTax){
        tipBox.className = "tax-tip tax-yes";
        tipBox.innerText = `警告：当前首发总KD ${tData.sumStarterKD}，超过4.5阈值，参赛需缴纳奢侈税`;
    }else{
        tipBox.className = "tax-tip tax-no";
        tipBox.innerText = `当前首发总KD ${tData.sumStarterKD}，低于4.5阈值，无需缴纳奢侈税`;
    }
    // 渲染首发
    const starterWrap = document.getElementById("starterWrap");
    starterWrap.innerHTML = "";
    tData.starters.forEach(item=>{
        let btnHtml = "";
        if(isCaptain){
            btnHtml = `<button class="btn btn-small btn-secondary" onclick="switchRole(${item.playerId},'substitute')">下调替补</button>`;
        }
        starterWrap.innerHTML += `
            <div class="slot starter">
                <div>${item.username}</div>
                <div style="margin:4px 0;color:#ffd700;">KD:${item.historical_total_kd}</div>
                ${btnHtml}
            </div>
        `
    })
    // 渲染替补
    const subWrap = document.getElementById("subWrap");
    subWrap.innerHTML = "";
    tData.substitute.forEach(item=>{
        let btnHtml = "";
        if(isCaptain){
            btnHtml = `<button class="btn btn-small" onclick="switchRole(${item.playerId},'starter')">上调首发</button>`;
        }
        subWrap.innerHTML += `
            <div class="slot">
                <div>${item.username}</div>
                <div style="margin:4px 0;color:#8b95a5;">KD:${item.historical_total_kd}</div>
                ${btnHtml}
            </div>
        `
    })
}

// 队长切换队员首发/替补
async function switchRole(playerId, newRole){
    const res = await fetch("/api/teamManage",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            teamId: currentTeamId,
            operatePlayerId: playerId,
            newRole: newRole,
            operateUsername: loginUserName
        })
    })
    const ret = await res.json();
    alert(ret.msg);
    if(ret.ok) loadTeamLineup();
}

// 加入战队按钮
document.getElementById("joinBtn").onclick = async function(){
    const code = document.getElementById("inviteCode").value.trim()
    if(!code) alert("请输入6位邀请码")
    const res = await fetch("/api/team",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({type:"join",username:loginUserName,inviteCode:code})
    })
    const ret = await res.json();
    alert(ret.msg);
    if(ret.ok) location.reload();
}
// 创建战队按钮
document.getElementById("createTeamBtn").onclick = async function(){
    const name = prompt("请输入战队名称：");
    if(!name) return;
    const res = await fetch("/api/team",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({type:"create",username:loginUserName,teamName:name})
    })
    const ret = await res.json();
    alert(ret.msg + (ret.ok ? " 战队邀请码："+ret.inviteCode : ""));
    if(ret.ok) location.reload();
}
</script>
</body>
</html>
