<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.M.N 队员个人中心</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: system-ui}
        header{background:#2c4266;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
        .logout{color:#d0e1ff;cursor:pointer}
        .container{max-width:1100px;margin:30px auto;padding:0 16px}
        .card{background:#fff;border:1px solid #e5e8f0;border-radius:8px;padding:24px;margin-bottom:20px}
        h2{color:#203459;margin-bottom:14px}
        p{margin:8px 0;color:#333;line-height:1.7}
    </style>
</head>
<body>
<header>
    <h1>D.M.N 战队队员中心</h1>
    <div class="logout" onclick="logout()">退出登录</div>
</header>
<div class="container">
    <div class="card">
        <h2>个人生涯数据</h2>
        <p>总场次：待同步PUBG赛事数据</p>
        <p>生涯KD：待同步PUBG赛事数据</p>
        <p>总击杀/总伤害：待同步PUBG赛事数据</p>
        <p>前十率、吃鸡数：待同步PUBG赛事数据</p>
    </div>
    <div class="card">
        <h2>公开榜单查询</h2>
        <p>• 战神榜（总击杀排名）</p>
        <p>• 伤害榜（场均伤害排名）</p>
        <p>• 生存榜（场均生存时间）</p>
        <p>• 吃鸡榜（吃鸡数量排行）</p>
        <p>• 战队总KD排行榜</p>
    </div>
    <div class="card">
        <h2>战队相关功能</h2>
        <p>• 查看本队阵容、换人历史记录</p>
        <p>• 查看全队奢侈税缴纳记录</p>
        <p>• 查看全部赛事回放与选手高光片段</p>
    </div>
    <div class="card">
        <h2>赛事赞助公示</h2>
        <p>展示老板赞助、全队奢侈税流水（全员可见）</p>
    </div>
</div>
<script>
function logout(){
    window.location.href="index.html"
}
</script>
</body>
</html>
