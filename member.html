<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D.M.N 战队队员中心</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        /* 样式同上（省略以节约篇幅，实际应与之前一致） */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0f1419;
            color: #f0f2f5;
        }
        header {
            background: linear-gradient(135deg, #1a2a48 0%, #0f1419 100%);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3342;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffd700;
        }
        .nav-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #b8c2cc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #ffd700;
        }
        .nav-links a.admin-link {
            color: #ffd700;
            font-weight: 700;
        }
        .logout {
            color: #ff5555;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 16px;
        }
        .season-select-wrap {
            text-align: right;
            margin-bottom: 10px;
        }
        #seasonSelect {
            padding: 6px 12px;
            background: #1a2430;
            color: #fff;
            border: 1px solid #2a3342;
            border-radius: 6px;
            font-size: 14px;
        }
        .section-title {
            font-size: 18px;
            margin: 24px 0 16px;
            color: #ffd700;
            font-weight: 700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 12px;
        }
        .card {
            background: #1a2430;
            border: 1px solid #2a3342;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
        }
        .card-title {
            font-size: 13px;
            color: #8b95a5;
            margin-bottom: 8px;
        }
        .card-value {
            font-size: 28px;
            font-weight: 800;
            color: #ffd700;
        }
        .card-sub {
            font-size: 12px;
            color: #6e7888;
            margin-top: 6px;
        }
        .toggle-wrap {
            text-align: center;
            margin: 12px 0;
        }
        #toggleMore {
            width: 100%;
            background: #1a2430;
            border: 1px solid #2a3342;
            color: #cccccc;
            border-radius: 12px;
            padding: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: .2s;
        }
        #toggleMore:hover {
            color: #ffd700;
            border-color: #ffd700;
        }
        .collapse-box {
            display: none;
            margin-bottom: 24px;
        }
        .collapse-box.show {
            display: block;
        }
        .panel {
            background: #1a2430;
            border: 1px solid #2a3342;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .radar-wrap {
            max-width: 480px;
            margin: 0 auto;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-grid .card {
            padding: 12px 14px;
            border-radius: 8px;
            background: #1e293b;
            border-color: #334155;
        }
        .stat-grid .card-title {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .stat-grid .card-value {
            font-size: 18px;
            font-weight: 700;
        }
        .stat-grid .card-sub {
            font-size: 10px;
            color: #64748b;
            margin-top: 2px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table th, table td {
            border: 1px solid #2a3342;
            padding: 10px 8px;
            text-align: center;
            font-size: 13px;
        }
        table th {
            background: #222d3b;
            color: #ffd700;
        }
        .empty {
            color: #7d8898;
            padding: 30px 0;
            text-align: center;
            font-size: 14px;
        }
        .full-match-btn {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 16px;
            padding: 12px;
            background: #ffd700;
            color: #0f1419;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, #1a2a48 0%, #0f1419 100%);
            border: 1px solid #2a3342;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
        }
        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #ffd700;
            flex-shrink: 0;
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .profile-name {
            font-size: 20px;
            font-weight: 800;
            color: #ffd700;
        }
        .profile-tag {
            font-size: 13px;
            color: #8b95a5;
        }
        .profile-rating {
            text-align: center;
            min-width: 70px;
        }
        .rating-num {
            font-size: 24px;
            font-weight: 800;
            color: #ffd700;
        }
        .rating-label {
            font-size: 12px;
            color: #8b95a5;
        }
        .radar-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 20px;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #2a3342;
        }
        .radar-score-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .radar-score-item .label {
            color: #94a3b8;
        }
        .radar-score-item .value {
            color: #ffd700;
            font-weight: 700;
        }
        .radar-score-item .rating {
            font-weight: 800;
            padding: 0 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .rating-S { background: #ff6b6b; color: #fff; }
        .rating-A { background: #feca57; color: #000; }
        .rating-B { background: #54a0ff; color: #fff; }
        .rating-C { background: #5f6c80; color: #fff; }
        .rating-D { background: #2d3436; color: #aaa; }

        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .nav-links { gap: 12px; }
            .nav-links a { font-size: 12px; }
            .radar-wrap { max-width: 100%; }
        }
        @media (max-width: 600px) {
            body { background: #111723; }
            header { flex-direction: row; flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
            .logo { font-size: 18px; }
            .nav-links { order: 3; width: 100%; justify-content: space-around; }
            .nav-links a { font-size: 13px; }
            .container { margin: 20px auto; padding: 0 12px; }
            .season-select-wrap { text-align: left; margin-bottom: 16px; }
            .section-title { font-size: 16px; margin: 20px 0 12px; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card { padding: 16px; border-radius: 10px; background: linear-gradient(135deg, #1e2a3a 0%, #161d29 100%); }
            .card-value { font-size: 22px; }
            .card-title { font-size: 12px; }
            .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .stat-grid .card { padding: 10px 12px; text-align: center; }
            .stat-grid .card-title { font-size: 10px; margin-bottom: 3px; }
            .stat-grid .card-value { font-size: 15px; }
            .panel { padding: 16px; border-radius: 10px; }
            table th, table td { padding: 8px 6px; font-size: 12px; }
            #toggleMore, .full-match-btn { padding: 14px; font-size: 15px; border-radius: 10px; }
            .profile-header { padding: 14px; gap: 12px; }
            .profile-avatar { width: 56px; height: 56px; }
            .profile-name { font-size: 18px; }
            .profile-rating { min-width: 60px; }
            .rating-num { font-size: 20px; }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
            table th, table td { padding: 6px 4px; font-size: 11px; }
            .card-value { font-size: 18px; }
        }
    </style>
</head>
<body>
<header>
    <div class="logo">D.M.N</div>
    <nav class="nav-links">
        <a href="member.html" class="active">队员中心</a>
        <a href="ranks.html">排行榜</a>
        <a href="team.html">我的战队</a>
        <a href="#">比赛回放</a>
        <a href="#">赞助公示</a>
        <a href="admin.html" id="adminLink" class="admin-link" style="display:none;">⚙️ 后台管理</a>
    </nav>
    <div class="logout" onclick="logout()">退出登录</div>
</header>
<div class="container">
    <div class="season-select-wrap">
        <select id="seasonSelect">
            <option value="all">全部比赛（生涯汇总）</option>
        </select>
    </div>

    <div class="profile-header">
        <div class="profile-avatar">
            <img src="https://p.qqan.com/up/2022-1/16410977238664997.jpg" alt="头像" onerror="this.src='https://www.huya.com/favicon.ico'" />
        </div>
        <div class="profile-info">
            <div class="profile-name" id="profileUserName">--</div>
            <div class="profile-tag">D.M.N 战队队员</div>
        </div>
        <div class="profile-rating">
            <div class="rating-num" id="headerKD">--</div>
            <div class="rating-label">KD</div>
        </div>
    </div>

    <div class="section-title">个人生涯概况</div>
    <div class="grid">
        <div class="card">
            <div class="card-title">当前赛季排名</div>
            <div class="card-value" id="rankVal">--</div>
            <div class="card-sub">按KD排名</div>
        </div>
        <div class="card">
            <div class="card-title">总场次</div>
            <div class="card-value" id="matchVal">--</div>
            <div class="card-sub">参赛局数</div>
        </div>
        <div class="card">
            <div class="card-title">吃鸡数</div>
            <div class="card-value" id="winVal">--</div>
            <div class="card-sub">第一名次数</div>
        </div>
        <div class="card">
            <div class="card-title">段位KD</div>
            <div class="card-value" id="kdVal">--</div>
            <div class="card-sub">击杀/死亡比值</div>
        </div>
    </div>

    <div class="toggle-wrap">
        <button id="toggleMore">更多摘要 ▼</button>
    </div>

    <div class="collapse-box" id="collapseWrap">
        <div class="section-title">详细赛季数据</div>
        <div class="stat-grid" id="statGrid"></div>

        <div class="section-title">个人综合能力雷达图</div>
        <div class="panel radar-wrap">
            <canvas id="abilityRadar"></canvas>
            <div class="radar-footer" id="radarFooter"></div>
        </div>
    </div>

    <div class="section-title">近期比赛战绩（近10场）</div>
    <div class="panel">
        <table>
            <thead>
                <tr>
                    <th>队伍排名</th>
                    <th>击杀</th>
                    <th>伤害</th>
                    <th>助攻</th>
                    <th>爆头</th>
                    <th>单局评分</th>
                </tr>
            </thead>
            <tbody id="matchTableBody">
                <tr><td colspan="6" class="empty">加载对局数据...</td></tr>
            </tbody>
            <tfoot>
                <tr><td colspan="6">
                    <a href="matchAll.html" class="full-match-btn">查看全部比赛</a>
                </td></tr>
            </tfoot>
        </table>
    </div>

    <div class="section-title">武器熟练度</div>
    <div class="panel">
        <table>
            <thead>
                <tr><th>武器</th><th>熟练度等级</th><th>总击杀 / 单场最高</th><th>最远击杀(m)</th><th>详情</th></tr>
            </thead>
            <tbody id="weaponTableBody">
                <tr><td colspan="5" class="empty">暂无武器数据</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
let radarChartInstance = null;
let radarRendered = false;
const radarLabels = ["生存", "Rating", "战斗", "支援", "吃鸡率"];
let allMatchData = [];
let currentSeason = "all";
let seasonSelect = document.getElementById('seasonSelect');
let seasonList = null; // 缓存赛季列表

// ---------- 工具函数 ----------
function calcRadarData(matches) {
    if (!matches || matches.length === 0) return [0,0,0,0,0];
    const total = matches.length;
    const totalKill = matches.reduce((s,m) => s + (m.击杀数||0), 0);
    const totalDamage = matches.reduce((s,m) => s + (m.总伤害量||0), 0);
    const totalAssist = matches.reduce((s,m) => s + (m.助攻数||0), 0);
    const totalSurvive = matches.reduce((s,m) => s + (m.存活时间||0), 0);
    const winCount = matches.filter(m => (m.队伍排名||0) === 1).length;
    const avgSurvive = totalSurvive / total / 60;
    const deathCount = matches.filter(m => m.死亡类型 !== 'alive').length;
    const avgKD = deathCount === 0 ? totalKill : totalKill / deathCount;
    const avgDmg = totalDamage / total;
    const winRate = (winCount / total) * 100;

    let survive = Math.min((avgSurvive / 25) * 100, 100);
    let rating = Math.min((avgKD / 3) * 100 + (avgDmg / 300) * 20, 100);
    let fight = Math.min((avgKD * 25) + (avgDmg / 20), 100);
    let assist = Math.min((totalAssist / total) * 10, 100);
    let win = Math.min(winRate * 2, 100);
    return [Math.round(survive), Math.round(rating), Math.round(fight), Math.round(assist), Math.round(win)];
}

function getRadarRating(score) {
    if (score >= 90) return { label: 'S', cls: 'rating-S' };
    if (score >= 80) return { label: 'A', cls: 'rating-A' };
    if (score >= 70) return { label: 'B', cls: 'rating-B' };
    if (score >= 60) return { label: 'C', cls: 'rating-C' };
    return { label: 'D', cls: 'rating-D' };
}

function calcSingleScore(kill, dmg, rank, win) {
    let rankScore = rank === 1 ? 100 : rank <= 10 ? 70 : Math.max(0, 100 - rank * 4);
    let killScore = Math.min(kill * 12, 100);
    let dmgScore = Math.min(dmg / 12, 100);
    let winBonus = win ? 12 : 0;
    return Math.round((rankScore * 0.35 + killScore * 0.35 + dmgScore * 0.2 + winBonus * 0.1) * 10) / 10;
}

// ---------- 更新下拉选项（只调用一次） ----------
function initSeasonOptions(seasons) {
    // seasons: 已排序的赛季数组
    const currentVal = seasonSelect.value;
    seasonSelect.innerHTML = '<option value="all">全部比赛（生涯汇总）</option>';
    seasons.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s + '赛季';
        seasonSelect.appendChild(opt);
    });
    // 恢复之前选中的值（如果存在）
    if ([...seasonSelect.options].some(o => o.value === currentVal)) {
        seasonSelect.value = currentVal;
    } else {
        seasonSelect.value = 'all';
    }
    currentSeason = seasonSelect.value;
}

// ---------- 主加载 ----------
async function loadPlayerStats() {
    const userName = localStorage.getItem("loginUser");
    if (!userName) return;

    // 清空 UI（略）
    document.getElementById('rankVal').innerText = '--';
    document.getElementById('matchVal').innerText = '--';
    document.getElementById('winVal').innerText = '--';
    document.getElementById('kdVal').innerText = '--';
    document.getElementById('headerKD').innerText = '--';
    document.getElementById('matchTableBody').innerHTML = `<tr><td colspan="6" class="empty">加载对局数据...</td>`;
    document.getElementById('weaponTableBody').innerHTML = `<tr><td colspan="5" class="empty">暂无武器数据</td>`;
    document.getElementById('statGrid').innerHTML = '';
    document.getElementById('radarFooter').innerHTML = '';
    allMatchData = [];

    try {
        // ----- 首次加载时获取赛季列表（仅一次） -----
        if (seasonList === null) {
            const allRes = await fetch(`/api/playerData?username=${userName}&season=all`);
            const allJson = await allRes.json();
            if (allJson.ok && allJson.data) {
                const allMatches = allJson.data;
                // 提取赛季
                const seasonSet = new Set();
                allMatches.forEach(m => {
                    if (m.赛季) seasonSet.add(m.赛季);
                });
                const seasons = Array.from(seasonSet).sort((a, b) => {
                    const numA = parseInt(a.replace('S','')) || 0;
                    const numB = parseInt(b.replace('S','')) || 0;
                    return numB - numA;
                });
                seasonList = seasons;
                initSeasonOptions(seasons);
                // 如果当前选中是 'all'，则直接使用 allJson.data 渲染，避免二次请求
                if (currentSeason === 'all') {
                    renderData(allJson.data, allJson.rank);
                    return;
                }
            } else {
                seasonList = []; // 避免重复请求
            }
        }

        // ----- 请求当前赛季数据 -----
        const res = await fetch(`/api/playerData?username=${userName}&season=${currentSeason}`);
        const json = await res.json();
        if (!json.ok || !json.data) {
            document.getElementById('matchTableBody').innerHTML = `<tr><td colspan="6" class="empty">暂无数据</td>`;
            return;
        }
        renderData(json.data, json.rank);

    } catch (err) {
        console.error('加载数据异常', err);
        document.getElementById('matchTableBody').innerHTML = `<tr><td colspan="6" class="empty">加载失败</td>`;
    }
}

// ---------- 渲染数据 ----------
function renderData(matches, rank) {
    if (!matches || matches.length === 0) {
        document.getElementById('matchTableBody').innerHTML = `<tr><td colspan="6" class="empty">该赛季暂无对局</td>`;
        return;
    }

    // 显示排名
    if (rank) {
        document.getElementById('rankVal').innerText = `#${rank}`;
    }

    allMatchData = matches;

    // 基本统计
    const total = matches.length;
    const totalKill = matches.reduce((s,m) => s + (m.击杀数||0), 0);
    const totalDeath = matches.filter(m => m.死亡类型 !== 'alive').length;
    const totalAssist = matches.reduce((s,m) => s + (m.助攻数||0), 0);
    const totalDamage = matches.reduce((s,m) => s + (m.总伤害量||0), 0);
    const totalSurvive = matches.reduce((s,m) => s + (m.存活时间||0), 0);
    const winCount = matches.filter(m => (m.队伍排名||0) === 1).length;
    const top10Count = matches.filter(m => (m.队伍排名||0) <= 10).length;
    const headshotCount = matches.reduce((s,m) => s + (m.爆头击杀数||0), 0);
    const bestRank = Math.min(...matches.map(m => m.队伍排名||999));
    const maxSurvive = Math.max(...matches.map(m => m.存活时间||0));
    const maxKillDist = Math.max(...matches.map(m => m.最长击杀距离||0));

    const avgSurviveMin = totalSurvive / total / 60;
    const kd = totalDeath === 0 ? totalKill : totalKill / totalDeath;
    const winRate = (winCount / total) * 100;
    const top10Rate = (top10Count / total) * 100;
    const headRate = totalKill === 0 ? 0 : (headshotCount / totalKill) * 100;
    const avgDmg = totalDamage / total;

    // 生涯概况
    document.getElementById("matchVal").innerText = total;
    document.getElementById("winVal").innerText = winCount;
    document.getElementById("kdVal").innerText = kd.toFixed(2);
    document.getElementById("headerKD").innerText = kd.toFixed(2);

    // 详细赛季数据
    const statGrid = document.getElementById('statGrid');
    const statItems = [
        { label: '总死亡', value: totalDeath, suffix: '' },
        { label: '总助攻', value: totalAssist, suffix: '' },
        { label: '总伤害', value: totalDamage.toFixed(2), suffix: '' },
        { label: '场均存活(min)', value: avgSurviveMin.toFixed(1), suffix: 'min' },
        { label: '吃鸡率', value: winRate.toFixed(1), suffix: '%' },
        { label: '前十场次', value: top10Count, suffix: '' },
        { label: '前十率', value: top10Rate.toFixed(1), suffix: '%' },
        { label: '爆头率', value: headRate.toFixed(1), suffix: '%' },
        { label: '赛季队伍最高排名', value: bestRank === 999 ? '-' : bestRank, suffix: '' },
        { label: '场均伤害', value: avgDmg.toFixed(2), suffix: '' },
        { label: '最长存活', value: (maxSurvive / 60).toFixed(1), suffix: 'min' },
        { label: '最长击杀距离(米)', value: maxKillDist.toFixed(2), suffix: '' }
    ];
    statGrid.innerHTML = statItems.map(item => `
        <div class="card">
            <div class="card-title">${item.label}</div>
            <div class="card-value">${item.value}</div>
            <div class="card-sub">${item.suffix}</div>
        </div>
    `).join('');

    // 雷达图
    const radarData = calcRadarData(matches);
    if (radarRendered && radarChartInstance) {
        radarChartInstance.data.datasets[0].data = radarData;
        radarChartInstance.update();
    }
    const footer = document.getElementById('radarFooter');
    const labels = ['生存', 'Rating', '战斗', '支援', '吃鸡率'];
    footer.innerHTML = radarData.map((score, idx) => {
        const rating = getRadarRating(score);
        return `<div class="radar-score-item">
            <span class="label">${labels[idx]}</span>
            <span class="value">${score}</span>
            <span class="rating ${rating.cls}">${rating.label}</span>
        </div>`;
    }).join('');

    // 近期10场
    const sorted = [...matches].sort((a,b) => {
        const sa = a.赛季 || '';
        const sb = b.赛季 || '';
        const numA = parseInt(sa.replace('S','')) || 0;
        const numB = parseInt(sb.replace('S','')) || 0;
        return numB - numA;
    });
    const recent = sorted.slice(0, 10);
    const tbody = document.getElementById('matchTableBody');
    tbody.innerHTML = '';
    if (recent.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty">暂无对局</td>`;
    } else {
        recent.forEach(m => {
            const rankVal = m.队伍排名 || '-';
            const kills = m.击杀数 || 0;
            const damage = (m.总伤害量 || 0);
            const assist = m.助攻数 || 0;
            const headshot = m.爆头击杀数 || 0;
            const score = calcSingleScore(kills, damage, rankVal, rankVal === 1);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${rankVal}</td>
                <td>${kills}</td>
                <td>${damage.toFixed(2)}</td>
                <td>${assist}</td>
                <td>${headshot}</td>
                <td>${score}</td>
            `;
            tbody.appendChild(tr);
        });
    }
}

// ---------- 雷达图初始化 ----------
function initRadarChart(dataArr) {
    const canvas = document.getElementById("abilityRadar");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (radarChartInstance) radarChartInstance.destroy();
    radarChartInstance = new Chart(ctx, {
        type: "radar",
        data: {
            labels: radarLabels,
            datasets: [{
                label: "综合能力",
                data: dataArr,
                backgroundColor: "rgba(255, 215, 0, 0.15)",
                borderColor: "#ffd700",
                pointBackgroundColor: "#ffd700",
                pointBorderColor: "#0f1419",
                pointRadius: 4,
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            scales: {
                r: {
                    min: 0,
                    max: 100,
                    ticks: { display: false },
                    grid: { color: "#2a3342" },
                    angleLines: { color: "#2a3342" },
                    pointLabels: { color: "#b8c2cc", font: { size: 12 } }
                }
            },
            plugins: {
                legend: { display: false },
                datalabels: {
                    color: "#fff",
                    font: { size: 11, weight: "bold" },
                    anchor: 'end',
                    align: 'end',
                    offset: 2
                }
            }
        },
        plugins: [ChartDataLabels]
    });
}

// ---------- 展开/收起 ----------
const toggleBtn = document.getElementById('toggleMore');
const collapseWrap = document.getElementById('collapseWrap');
toggleBtn.addEventListener('click', ()=>{
    collapseWrap.classList.toggle('show');
    const show = collapseWrap.classList.contains('show');
    toggleBtn.innerText = show ? '收起摘要 ▲' : '更多摘要 ▼';
    if(show && !radarRendered){
        const radarData = calcRadarData(allMatchData);
        initRadarChart(radarData);
        radarRendered = true;
    }
});

function logout() {
    localStorage.removeItem("loginUser");
    localStorage.removeItem("userRole");
    window.location.href = "index.html";
}

// ---------- 页面初始化 ----------
document.addEventListener('DOMContentLoaded', function(){
    const userName = localStorage.getItem("loginUser");
    if (!userName) {
        window.location.href = "index.html";
        return;
    }
    document.getElementById("profileUserName").innerText = userName;

    const userRole = localStorage.getItem("userRole");
    const adminLink = document.getElementById("adminLink");
    if (userRole === "admin") {
        adminLink.style.display = "inline";
    }

    // 加载数据（内部会初始化下拉）
    loadPlayerStats();

    // 监听下拉变化
    seasonSelect.addEventListener('change', function () {
        currentSeason = this.value;
        radarRendered = false;
        collapseWrap.classList.remove('show');
        toggleBtn.innerText = '更多摘要 ▼';
        loadPlayerStats(); // 重新加载数据（seasonList 已存在，不会重复请求 all）
    });
});
</script>
