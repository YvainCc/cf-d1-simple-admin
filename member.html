<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.M.N 战队管理系统 - 队员中心</title>
    <!-- deploy refresh 2026 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            color: #eee;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #181a20;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background-color: #111317;
        }
        .header-title {
            font-size: 22px;
            color: #ffd337;
            font-weight: bold;
        }
        nav a {
            margin: 0 10px;
            text-decoration: none;
            font-size: 15px;
        }
        nav a.active {
            color: #ffd337;
        }
        .logout-btn {
            color: #ff5050;
            cursor: pointer;
        }
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .user-card {
            background-color: #22252c;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom:24px;
        }
        .user-left {
            display:flex;
            align-items:center;
            gap:16px;
        }
        .avatar {
            width:64px;
            height:64px;
            border-radius:50%;
            background:#444;
            overflow:hidden;
        }
        .kd-num {
            font-size:32px;
            font-weight:bold;
            color:#ffd337;
            text-align:right;
        }
        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap:16px;
            margin-bottom:24px;
        }
        .stat-item {
            background:#22252c;
            border-radius:10px;
            padding:20px;
        }
        .stat-label {
            font-size:14px;
            color:#aaa;
            margin-bottom:8px;
        }
        .stat-value {
            font-size:26px;
            font-weight:bold;
        }
        .radar-wrap{
            background:#22252c;
            border-radius:10px;
            padding:20px;
            min-height:320px;
        }
    </style>
</head>
<body>
<header>
    <div class="header-title">D.M.N</div>
    <nav>
        <a href="member.html" class="active">队员中心</a>
        <a href="ranks.html">排行榜</a>
        <a href="team.html">我的战队</a>
        <a href="#">比赛回放</a>
        <a href="#">赞助公示</a>
    </nav>
    <div class="logout-btn" onclick="logout()">退出登录</div>
</header>
<div class="container">
    <div class="user-card">
        <div class="user-left">
            <div class="avatar">
                <img style="width:100%;height:100%;object-fit:cover" src="" id="avatarImg">
            </div>
            <div>
                <div style="font-size:22px;font-weight:bold" id="showUsername"></div>
                <div style="color:#aaa;margin-top:4px" id="showRole"></div>
            </div>
        </div>
        <div>
            <div class="kd-num" id="showKD">0.00</div>
            <div style="text-align:right;color:#aaa;font-size:13px">KD</div>
        </div>
    </div>

    <h3 style="margin-bottom:16px">个人生涯概况</h3>
    <div class="grid-row">
        <div class="stat-item">
            <div class="stat-label">当前赛季排名</div>
            <div class="stat-value" id="rankText">--</div>
            <div style="font-size:12px;color:#aaa;margin-top:4px">赛季分段总排名</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">总场次</div>
            <div class="stat-value" id="matchCount">0</div>
            <div style="font-size:12px;color:#aaa;margin-top:4px">本赛季参赛局数</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">吃鸡数</div>
            <div class="stat-value" id="winCount">0</div>
            <div style="font-size:12px;color:#aaa;margin-top:4px">第一名次数</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">段位KD</div>
            <div class="stat-value" id="kdText">0.00</div>
            <div style="font-size:12px;color:#aaa;margin-top:4px">击杀/死亡比值</div>
        </div>
    </div>
    <div class="radar-wrap">
        <div id="radarChart"></div>
    </div>
</div>

<script>
// 导航链接自动追加随机防缓存参数
document.querySelectorAll("nav a").forEach(a=>{
    const sep = a.href.includes("?") ? "&" : "?";
    a.href += sep + "_t=" + Date.now();
})

let isRedirecting = false;
function safeGoLogin(){
    if(isRedirecting) return;
    isRedirecting = true;
    location.href = "index.html";
}

async function apiFetch(url, opt={}){
  const token = localStorage.getItem("loginToken");
  const headers = {
    "Content-Type":"application/json",
    ...opt.headers
  };
  if(token) headers["Authorization"] = `Bearer ${token}`;
  const res = await fetch(url, {...opt, headers});
  const contentType = res.headers.get("content-type") || "";

  if(contentType.includes("text/html")){
      safeGoLogin();
      throw new Error("返回页面，鉴权失效");
  }
  const json = await res.json();
  if(res.status === 401 || json.ok === false){
      localStorage.removeItem("loginToken");
      localStorage.removeItem("loginUser");
      localStorage.removeItem("loginRole");
      safeGoLogin();
      throw new Error("登录凭证无效");
  }
  return json;
}

function logout(){
    localStorage.removeItem("loginToken");
    localStorage.removeItem("loginUser");
    localStorage.removeItem("loginRole");
    safeGoLogin();
}

// 页面最优先鉴权
(function initCheck(){
    const token = localStorage.getItem("loginToken");
    const username = localStorage.getItem("loginUser");
    if(!token || !username){
        safeGoLogin();
    }
})();

window.onload = async function(){
    const username = localStorage.getItem("loginUser");
    const role = localStorage.getItem("loginRole");
    document.getElementById("showUsername").innerText = username;
    document.getElementById("showRole").innerText = role === "admin" ? "管理员" : "D.M.N 战队队员";

    try {
        const ts = Date.now();
        const data = await apiFetch(`/api/playerData.js?username=${username}&_t=${ts}`,{
            method:"GET"
        });
        if(data.ok){
            const d = data.data;
            document.getElementById("matchCount").innerText = d.total_match || 0;
            document.getElementById("winCount").innerText = d.total_win || 0;
            document.getElementById("kdText").innerText = d.historical_total_kd || "0.00";
            document.getElementById("showKD").innerText = d.historical_total_kd || "0.00";
        }
    } catch(e){
        console.log("数据加载异常：",e);
    }
}
</script>
</body>
</html>
