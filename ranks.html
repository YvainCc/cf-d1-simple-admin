<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D.M.N 战队排行榜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0c1117;
            color: #f0f2f5;
        }
        header {
            background: linear-gradient(135deg, #1a2a48 0%, #0c1117 100%);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #202a38;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffd700;
        }
        .nav-links {
            display: flex;
            gap: 24px;
        }
        .nav-links a {
            color: #b8c2cc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #ffd700;
        }
        .logout {
            color: #ff5555;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .container {
            max-width: 1240px;
            margin: 32px auto;
            padding: 0 16px;
        }
        .top-bar-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap:14px;
        }
        #seasonSelect {
            padding: 7px 14px;
            background: #161d28;
            color: #fff;
            border: 1px solid #2a3342;
            border-radius: 6px;
            font-size: 14px;
        }
        .tab-group {
            display: flex;
            gap:10px;
            flex-wrap: wrap;
        }
        .tab-group button {
            padding: 8px 18px;
            border-radius: 6px;
            border: none;
            background:#1f2836;
            color:#b8c2cc;
            cursor:pointer;
            font-size:14px;
            transition:0.2s;
        }
        .tab-group button.active {
            background:#ffd700;
            color:#0c1117;
            font-weight:bold;
        }
        /* 前三名金银铜卡片 顺序：亚军 - 冠军 - 季军 */
        .top3-wrap {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap:20px;
            margin-bottom:28px;
        }
        .rank-card {
            border-radius:10px;
            padding:24px 12px;
            text-align:center;
        }
        .rank-1 {
            background: linear-gradient(160deg,#b48c00,#6b5200);
            border:1px solid #ffd700;
        }
        .rank-2 {
            background: linear-gradient(160deg,#646e7b,#373e48);
            border:1px solid #a9b1bb;
        }
        .rank-3 {
            background: linear-gradient(160deg,#805333,#4d3422);
            border:1px solid #c48b5c;
        }
        .rank-medal {
            font-size:36px;
            margin-bottom:10px;
        }
        .rank-name {
            font-size:18px;
            font-weight:bold;
            margin-bottom:8px;
        }
        .rank-value-line {
            color:#ffd700;
            font-size:16px;
            margin-bottom:6px;
        }
        .rank-desc {
            font-size:13px;
            color:#dddddd;
        }
        /* 表格区域 */
        .table-wrap {
            background:#161d28;
            border:1px solid #2a3342;
            border-radius:10px;
            overflow:hidden;
        }
        table {
            width:100%;
            border-collapse: collapse;
        }
        th,td {
            padding:15px 10px;
            text-align:center;
            font-size:14px;
            border-bottom:1px solid #202a38;
        }
        th {
            background:#1c2533;
            color:#ffd700;
        }
        tr:hover {
            background:#1e2836;
        }
        .empty-tip {
            padding:50px;
            text-align:center;
            color:#828c9c;
        }
        /* 移动端适配 */
        @media(max-width:768px){
            .top3-wrap {
                grid-template-columns:1fr;
            }
            th,td {
                padding:10px 4px;
                font-size:12px;
            }
            .container {
                padding:0 12px;
            }
            header {
                padding:12px 16px;
                flex-wrap:wrap;
                gap:10px;
            }
            .nav-links {
                order:3;
                width:100%;
                justify-content:space-around;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="logo">D.M.N</div>
    <nav class="nav-links">
        <a href="member.html">队员中心</a>
        <a href="ranks.html" class="active">排行榜</a>
        <a href="team.html">我的战队</a>
        <a href="#">比赛回放</a>
        <a href="#">赞助公示</a>
    </nav>
    <div class="logout" onclick="logout()">退出登录</div>
</header>
<div class="container">
    <div class="top-bar-wrap">
        <div class="tab-group">
            <button data-type="kill" class="active">战神榜（总击杀）</button>
            <button data-type="damage">伤害榜</button>
            <button data-type="win">吃鸡榜</button>
            <button data-type="kd">KD榜</button>
            <button data-type="teamkill">战队总击杀榜</button>
        </div>
        <select id="seasonSelect">
            <option value="all">全部比赛（生涯汇总）</option>
            <option value="S5">S5赛季</option>
            <option value="S6">S6赛季</option>
        </select>
    </div>

    <!-- 金银铜前三名 顺序：亚军 - 冠军 - 季军 -->
    <div class="top3-wrap" id="top3Box">
        <div class="rank-card rank-2" id="card2">
            <div class="rank-medal">🥈</div>
            <div class="rank-name">--</div>
            <div class="rank-value-line">--</div>
            <div class="rank-desc">总击杀 -- | KD --</div>
        </div>
        <div class="rank-card rank-1" id="card1">
            <div class="rank-medal">🥇</div>
            <div class="rank-name">--</div>
            <div class="rank-value-line">--</div>
            <div class="rank-desc">总击杀 -- | KD --</div>
        </div>
        <div class="rank-card rank-3" id="card3">
            <div class="rank-medal">🥉</div>
            <div class="rank-name">--</div>
            <div class="rank-value-line">--</div>
            <div class="rank-desc">总击杀 -- | KD --</div>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>排名</th>
                    <th>玩家名称</th>
                    <th>总局数</th>
                    <th>总击杀</th>
                    <th>总死亡</th>
                    <th>总助攻</th>
                    <th>总伤害</th>
                    <th>KD值</th>
                </tr>
            </thead>
            <tbody id="rankTbody">
                <tr>
                    <td colspan="8" class="empty-tip">暂无榜单数据</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
let currentType = "kill";
let currentSeason = "all";
const tabBtns = document.querySelectorAll(".tab-group button");
const seasonSel = document.getElementById("seasonSelect");

tabBtns.forEach(btn=>{
    btn.addEventListener("click",()=>{
        tabBtns.forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        currentType = btn.dataset.type;
        loadRankData();
    })
})
seasonSel.addEventListener("change",()=>{
    currentSeason = seasonSel.value;
    loadRankData();
})

function logout() {
    localStorage.removeItem("loginUser");
    window.location.href = "index.html";
}

function fillEmptyCard(el){
    el.querySelector(".rank-name").innerText = "--";
    el.querySelector(".rank-value-line").innerText = "--";
    el.querySelector(".rank-desc").innerText = "总击杀 -- | KD --";
}

async function loadRankData(){
    const res = await fetch(`/api/rank?season=${currentSeason}&type=${currentType}`);
    const json = await res.json();
    const list = json.data || [];
    const tbody = document.getElementById("rankTbody");
    const card1 = document.getElementById("card1");
    const card2 = document.getElementById("card2");
    const card3 = document.getElementById("card3");

    if(list.length === 0){
        tbody.innerHTML = `<tr><td colspan="8" class="empty-tip">暂无榜单数据</td>`;
        fillEmptyCard(card1);
        fillEmptyCard(card2);
        fillEmptyCard(card3);
        return;
    }
    // 填充前三名卡片
    const first = list[0];
    const second = list[1] || {};
    const third = list[2] || {};

    function fillCard(el, item){
        let showVal;
        switch(currentType){
            case "kill": showVal = item.total_kill ?? 0; break;
            case "damage": showVal = Math.round(item.total_damage ?? 0); break;
            case "win": showVal = item.total_win ??0; break;
            case "kd": showVal = Number(item.historical_total_kd ??0).toFixed(2); break;
            default: showVal = item.total_kill ??0;
        }
        el.querySelector(".rank-name").innerText = item.username || "未知";
        el.querySelector(".rank-value-line").innerText = showVal;
        el.querySelector(".rank-desc").innerText = `总击杀 ${item.total_kill??0} | KD ${Number(item.historical_total_kd??0).toFixed(2)}`;
    }
    fillCard(card1, first);
    fillCard(card2, second);
    fillCard(card3, third);

    // 表格渲染
    let html = "";
    list.forEach((row,idx)=>{
        html += `
        <tr>
            <td>${idx+1}</td>
            <td>${row.username}</td>
            <td>${row.total_match??0}</td>
            <td>${row.total_kill??0}</td>
            <td>${row.total_death??0}</td>
            <td>${row.total_assist??0}</td>
            <td>${Math.round(row.total_damage??0)}</td>
            <td>${Number(row.historical_total_kd??0).toFixed(2)}</td>
        </tr>`;
    })
    tbody.innerHTML = html;
}

document.addEventListener("DOMContentLoaded",()=>{
    const uname = localStorage.getItem("loginUser");
    if(!uname){
        window.location.href="index.html";
        return;
    }
    loadRankData();
})
</script>
</body>
</html>
