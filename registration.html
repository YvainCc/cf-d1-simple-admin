<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>报名 - D.M.N 战队队员中心</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a2a48">
    <style>
        /* ===== 与 member.html 完全一致 ===== */
        :root {
            --primary: #1a2a48;
            --gold: #c9a84c;
            --gold-light: #f0e3c8;
            --bg: #f2f4f8;
            --card-bg: #ffffff;
            --text-main: #1a1a2e;
            --text-secondary: #4a4a5a;
            --text-muted: #8e98a3;
            --border-light: #eef0f4;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --radius-card: 20px;
            --radius-sm: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 12px);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            padding-bottom: calc(72px + var(--safe-bottom));
            -webkit-font-smoothing: antialiased;
        }
        .navbar {
            background: var(--card-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.88);
        }
        .logo { font-size:20px; font-weight:700; color:var(--primary); }
        .logo span { color:var(--gold); }
        .nav-actions { display:flex; align-items:center; gap:16px; }
        .nav-actions .icon-btn { background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-secondary); padding:4px; position:relative; }
        .nav-actions .icon-btn:active { transform:scale(0.92); }
        .badge-dot { position:absolute; top:0; right:0; width:8px; height:8px; background:#ea4335; border-radius:50%; border:2px solid #fff; }
        .container { max-width:480px; margin:0 auto; padding:16px 16px 0; }

        /* ===== 进度条 ===== */
        .progress-card {
            background:var(--card-bg); border-radius:var(--radius-card); padding:16px 20px;
            box-shadow:var(--shadow-sm); margin-bottom:14px;
        }
        .progress-card .label { font-size:14px; color:var(--text-muted); display:flex; justify-content:space-between; }
        .progress-card .label span { font-weight:600; color:var(--text-main); }
        .progress-bar { width:100%; height:8px; background:var(--border-light); border-radius:4px; margin-top:8px; overflow:hidden; }
        .progress-bar .fill { height:100%; background:linear-gradient(90deg, var(--gold), var(--primary)); border-radius:4px; transition:width 0.6s ease; width:40%; }

        /* ===== 车位网格 ===== */
        .parking-grid {
            display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:14px;
        }
        .parking-slot {
            aspect-ratio:1/1; border-radius:var(--radius-sm); display:flex; flex-direction:column;
            align-items:center; justify-content:center; font-size:11px; font-weight:600;
            transition:0.25s; border:2px solid var(--border-light); background:var(--card-bg);
            color:var(--text-muted); cursor:pointer; gap:2px; box-shadow:var(--shadow-sm);
        }
        .parking-slot:active { transform:scale(0.92); }
        .parking-slot .num { font-size:12px; font-weight:700; }
        .parking-slot .status-icon { font-size:16px; }
        .parking-slot.available { border-color:var(--border-light); background:var(--card-bg); color:var(--text-muted); }
        .parking-slot.pending { border-color:#fbad39; background:#fff8e6; color:#856404; }
        .parking-slot.approved { border-color:#0f9d58; background:#e6f9ed; color:#0f9d58; }
        .parking-slot.rejected { border-color:#ea4335; background:#fef0ef; color:#ea4335; }

        /* ===== 状态卡 ===== */
        .status-card {
            background:var(--card-bg); border-radius:var(--radius-card); padding:16px 20px;
            box-shadow:var(--shadow-sm); margin-bottom:14px;
        }
        .status-card .title { font-size:15px; font-weight:600; color:var(--text-main); }
        .status-card .desc { font-size:13px; color:var(--text-muted); margin-top:4px; }
        .status-card .action-btn {
            margin-top:12px; width:100%; padding:14px; border:none; border-radius:var(--radius-sm);
            font-size:15px; font-weight:600; cursor:pointer; background:var(--gold); color:#1a1a2e;
            box-shadow:0 4px 14px rgba(201,168,76,0.30); transition:0.2s;
        }
        .status-card .action-btn:active { transform:scale(0.97); opacity:0.85; }
        .status-card .action-btn.secondary { background:var(--primary); color:#fff; box-shadow:0 4px 14px rgba(26,42,72,0.20); }

        /* ===== 底部导航 ===== */
        .bottom-nav {
            position:fixed; bottom:0; left:0; right:0; background:var(--card-bg); border-top:1px solid var(--border-light);
            display:flex; justify-content:space-around; padding:6px 0 calc(6px + var(--safe-bottom)); z-index:100;
            box-shadow:0 -2px 12px rgba(0,0,0,0.03);
        }
        .bottom-nav a {
            text-decoration:none; text-align:center; font-size:10px; color:var(--text-muted);
            padding:4px 12px; border-radius:8px; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:48px;
        }
        .bottom-nav a .nav-icon { font-size:22px; line-height:1.2; }
        .bottom-nav a.active { color:var(--gold); font-weight:600; }
        .bottom-nav a:active { transform:scale(0.92); }

        @media (prefers-color-scheme: dark) {
            :root { --bg:#0f1419; --card-bg:#1a2430; --text-main:#f0f2f5; --text-secondary:#b8c2cc; --text-muted:#6e7a8a; --border-light:#2a3342; --shadow-sm:0 2px 8px rgba(0,0,0,0.4); }
            .navbar { background:rgba(26,36,48,0.92); border-bottom-color:var(--border-light); }
            .parking-slot { background:var(--card-bg); border-color:var(--border-light); color:var(--text-muted); }
            .parking-slot.approved { border-color:#0f9d58; background:#1a3a2a; color:#8dd4a8; }
            .parking-slot.pending { border-color:#fbad39; background:#3d3a1a; color:#f5e7b2; }
            .parking-slot.rejected { border-color:#ea4335; background:#3d1a1a; color:#f5a0a0; }
            .bottom-nav { background:var(--card-bg); border-top-color:var(--border-light); }
            .bottom-nav a { color:#6e7a8a; }
            .bottom-nav a.active { color:var(--gold); }
            .progress-card .label span { color:#f0f2f5; }
            .status-card .action-btn.secondary { background:var(--gold); color:#1a1a2e; }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">D.<span>M</span>.N</div>
        <div class="nav-actions">
            <button class="icon-btn" onclick="alert('暂无新通知')">🔔<span class="badge-dot"></span></button>
            <a href="member.html" style="font-size:14px; color:var(--text-muted); text-decoration:none;">返回</a>
        </div>
    </header>

    <main class="container">
        <!-- 进度 -->
        <div class="progress-card">
            <div class="label"><span>🏁 报名进度</span><span id="progressText">8 / 20 队</span></div>
            <div class="progress-bar"><div class="fill" id="progressFill" style="width:40%;"></div></div>
        </div>

        <!-- 车位 -->
        <div class="parking-grid" id="parkingGrid"></div>

        <!-- 状态卡 -->
        <div class="status-card">
            <div class="title" id="statusTitle">📝 我的报名状态</div>
            <div class="desc" id="statusDesc">您尚未创建或加入战队，点击下方按钮开始</div>
            <button class="action-btn" id="mainActionBtn">➕ 创建战队</button>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="member.html"><span class="nav-icon">🏠</span>首页</a>
        <a href="leaderboard.html"><span class="nav-icon">📊</span>榜单</a>
        <a href="registration.html" class="active"><span class="nav-icon">📝</span>报名</a>
        <a href="news.html"><span class="nav-icon">📰</span>资讯</a>
        <a href="profile.html"><span class="nav-icon">👤</span>我的</a>
    </nav>

    <script>
        const totalSlots = 20;
        let slots = [];
        function loadSlots() {
            const saved = localStorage.getItem('parkingSlots');
            if (saved) { slots = JSON.parse(saved); }
            else { slots = Array(totalSlots).fill(0); for(let i=0;i<8;i++) slots[i]=1; slots[8]=2; slots[9]=2; slots[10]=3; localStorage.setItem('parkingSlots', JSON.stringify(slots)); }
            return slots;
        }
        function renderParking() {
            const grid = document.getElementById('parkingGrid');
            const statusMap = { 0:{label:'空位',cls:'available',icon:'⚪'}, 1:{label:'已报',cls:'approved',icon:'✅'}, 2:{label:'待审',cls:'pending',icon:'⏳'}, 3:{label:'驳回',cls:'rejected',icon:'❌'} };
            let html = '';
            slots.forEach((status, index) => {
                const info = statusMap[status] || statusMap[0];
                html += `<div class="parking-slot ${info.cls}" onclick="alert('车位 ${index+1}: ${info.label}')"><span class="num">${index+1}</span><span class="status-icon">${info.icon}</span></div>`;
            });
            grid.innerHTML = html;
            const approved = slots.filter(s => s === 1).length;
            const pending = slots.filter(s => s === 2).length;
            document.getElementById('progressText').textContent = `${approved + pending} / ${totalSlots} 队`;
            document.getElementById('progressFill').style.width = `${((approved + pending) / totalSlots) * 100}%`;
        }
        loadSlots(); renderParking();

        const loginUser = localStorage.getItem('loginUser');
        document.getElementById('mainActionBtn').addEventListener('click', function() {
            if (this.textContent.includes('创建')) {
                const name = prompt('请输入战队名称：');
                if (name) {
                    localStorage.setItem('userTeam', name);
                    document.getElementById('statusTitle').textContent = `✅ 已报名：${name}`;
                    document.getElementById('statusDesc').textContent = '等待管理员审核中，请耐心等待';
                    this.textContent = '📋 查看报名详情';
                    this.className = 'action-btn secondary';
                    alert(`战队 "${name}" 创建成功！请等待审核`);
                }
            } else {
                alert('查看报名详情功能开发中...');
            }
        });
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/service-worker.js'); }
    </script>
</body>
</html>
