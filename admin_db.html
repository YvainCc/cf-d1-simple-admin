<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 战绩导入</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #0f1419; color: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #ffd700; margin-bottom: 20px; }
        .back-link { color: #8b95a5; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 20px; }
        .back-link:hover { color: #ffd700; }
        .upload-area {
            background: #1a2430;
            border: 2px dashed #2a3342;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .upload-area input[type="file"] {
            display: block;
            margin: 16px auto;
            color: #ccc;
        }
        .upload-area .btn {
            background: #ffd700;
            color: #0f1419;
            border: none;
            padding: 10px 30px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: .2s;
        }
        .upload-area .btn:disabled {
            background: #5a5a5a;
            color: #888;
            cursor: not-allowed;
        }
        .upload-area .btn:hover:not(:disabled) {
            background: #e6c200;
        }
        .progress-wrap {
            background: #222d3b;
            border-radius: 10px;
            height: 24px;
            overflow: hidden;
            margin: 16px 0;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #ffd700;
            transition: width 0.3s;
            text-align: center;
            line-height: 24px;
            color: #0f1419;
            font-weight: bold;
            font-size: 13px;
        }
        .log-box {
            background: #1a2430;
            border: 1px solid #2a3342;
            border-radius: 8px;
            padding: 12px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            color: #b8c2cc;
            margin-top: 16px;
        }
        .log-box .success { color: #7bed9f; }
        .log-box .error { color: #ff6b81; }
        .log-box .info { color: #70a1ff; }
    </style>
</head>
<body>
<div class="container">
    <a href="member.html" class="back-link">← 返回队员中心</a>
    <h1>⚙️ 后台管理 – 战绩数据导入</h1>

    <div class="upload-area">
        <p style="color:#8b95a5; margin-bottom:8px;">请上传 <strong>.xlsx</strong> 或 <strong>.xls</strong> 文件（支持多 Sheet）</p>
        <input type="file" id="fileInput" accept=".xlsx,.xls" />
        <button class="btn" id="uploadBtn">开始导入</button>
        <div class="progress-wrap">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        <div id="statusMsg" style="color:#8b95a5; font-size:14px; margin-top:6px;">等待操作...</div>
    </div>

    <div class="log-box" id="logBox">📋 日志将在此显示...</div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const progressBar = document.getElementById('progressBar');
    const statusMsg = document.getElementById('statusMsg');
    const logBox = document.getElementById('logBox');

    // 权限检查：非管理员跳转
    const role = localStorage.getItem('userRole');
    if (role !== 'admin') {
        logBox.innerHTML = '<span class="error">⛔ 您不是超级管理员，无权访问后台！</span>';
        uploadBtn.disabled = true;
        fileInput.disabled = true;
    }

    function appendLog(text, type = 'info') {
        const line = document.createElement('div');
        line.className = type;
        line.textContent = text;
        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function setProgress(percent, text) {
        progressBar.style.width = Math.min(percent, 100) + '%';
        progressBar.textContent = Math.round(percent) + '%';
        if (text) statusMsg.textContent = text;
    }

    uploadBtn.addEventListener('click', async () => {
        const file = fileInput.files[0];
        if (!file) {
            appendLog('❌ 请先选择一个 Excel 文件', 'error');
            return;
        }

        uploadBtn.disabled = true;
        setProgress(0, '正在解析文件...');
        appendLog(`📂 开始解析文件: ${file.name}`);

        try {
            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array' });
            let allRows = [];

            workbook.SheetNames.forEach(sheetName => {
                const sheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(sheet);
                if (rows.length) {
                    appendLog(`📄 Sheet "${sheetName}" 解析到 ${rows.length} 行`);
                    allRows = allRows.concat(rows);
                }
            });

            if (allRows.length === 0) {
                appendLog('⚠️ 未解析到任何数据行', 'error');
                uploadBtn.disabled = false;
                setProgress(0, '无数据');
                return;
            }

            appendLog(`✅ 共解析 ${allRows.length} 条战绩数据，准备分批导入...`);

            const BATCH_SIZE = 500;
            let totalInserted = 0;

            for (let i = 0; i < allRows.length; i += BATCH_SIZE) {
                const batch = allRows.slice(i, i + BATCH_SIZE);
                const percent = ((i + batch.length) / allRows.length) * 100;
                setProgress(percent, `正在导入第 ${i+1} ~ ${i+batch.length} 条...`);

                const resp = await fetch('/api/import-battles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(batch)
                });

                const result = await resp.json();
                if (!resp.ok) {
                    throw new Error(result.error || `批次 ${i/BATCH_SIZE+1} 导入失败`);
                }
                totalInserted += result.inserted || 0;
                appendLog(`✅ 批次 ${i/BATCH_SIZE+1} 成功写入 ${result.inserted} 条`, 'success');
            }

            setProgress(100, `🎉 全部导入完成！共 ${totalInserted} 条`);
            appendLog(`🎉 导入完成，总计 ${totalInserted} 条战绩已入库`, 'success');

        } catch (err) {
            appendLog(`❌ 导入失败：${err.message}`, 'error');
            setProgress(0, '导入失败');
        } finally {
            uploadBtn.disabled = false;
        }
    });
</script>
</body>
</html>
