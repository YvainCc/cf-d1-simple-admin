<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>资讯 - D.M.N 战队队员中心</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a2a48">
    <style>
        /* 与 member.html 完全一致，此处省略 */
        :root {
            --primary: #1a2a48;
            --gold: #c9a84c;
            --gold-light: #f0e3c8;
            --bg: #f2f4f8;
            --card-bg: #ffffff;
            --text-main: #1a1a2e;
            --text-secondary: #4a4a5a;
            --text-muted: #8e98a3;
            --border-light: #eef0f4;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --radius-card: 20px;
            --radius-sm: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 12px);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            padding-bottom: calc(72px + var(--safe-bottom));
            -webkit-font-smoothing: antialiased;
        }
        .navbar {
            background: var(--card-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.88);
        }
        .logo { font-size:20px; font-weight:700; color:var(--primary); }
        .logo span { color:var(--gold); }
        .nav-actions { display:flex; align-items:center; gap:16px; }
        .nav-actions .icon-btn { background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-secondary); padding:4px; position:relative; }
        .nav-actions .icon-btn:active { transform:scale(0.92); }
        .badge-dot { position:absolute; top:0; right:0; width:8px; height:8px; background:#ea4335; border-radius:50%; border:2px solid #fff; }
        .container { max-width:480px; margin:0 auto; padding:16px 16px 0; }
        .news-card {
            background:var(--card-bg); border-radius:var(--radius-card); padding:16px 18px;
            box-shadow:var(--shadow-sm); margin-bottom:12px; cursor:pointer; transition:0.2s;
        }
        .news-card:active { transform:scale(0.98); }
        .news-card .source { font-size:11px; color:var(--gold); font-weight:600; margin-bottom:4px; }
        .news-card .title { font-size:15px; font-weight:600; color:var(--text-main); line-height:1.4; }
        .news-card .summary { font-size:13px; color:var(--text-muted); margin-top:6px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .news-card .time { font-size:11px; color:var(--text-muted); margin-top:8px; }
        .news-card .tag { display:inline-block; font-size:10px; background:var(--gold-light); color:var(--gold); padding:2px 10px; border-radius:20px; font-weight:600; margin-top:6px; }
        .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
        .empty-state .icon { font-size:48px; margin-bottom:12px; }
        .bottom-nav {
            position:fixed; bottom:0; left:0; right:0; background:var(--card-bg); border-top:1px solid var(--border-light);
            display:flex; justify-content:space-around; padding:6px 0 calc(6px + var(--safe-bottom)); z-index:100;
            box-shadow:0 -2px 12px rgba(0,0,0,0.03);
        }
        .bottom-nav a {
            text-decoration:none; text-align:center; font-size:10px; color:var(--text-muted);
            padding:4px 12px; border-radius:8px; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:48px;
        }
        .bottom-nav a .nav-icon { font-size:22px; line-height:1.2; }
        .bottom-nav a.active { color:var(--gold); font-weight:600; }
        .bottom-nav a:active { transform:scale(0.92); }
        @media (prefers-color-scheme: dark) {
            :root { --bg:#0f1419; --card-bg:#1a2430; --text-main:#f0f2f5; --text-secondary:#b8c2cc; --text-muted:#6e7a8a; --border-light:#2a3342; --shadow-sm:0 2px 8px rgba(0,0,0,0.4); }
            .navbar { background:rgba(26,36,48,0.92); border-bottom-color:var(--border-light); }
            .bottom-nav { background:var(--card-bg); border-top-color:var(--border-light); }
            .bottom-nav a { color:#6e7a8a; }
            .bottom-nav a.active { color:var(--gold); }
            .news-card .title { color:#f0f2f5; }
            .news-card .tag { background:#2a3342; color:var(--gold); }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">D.<span>M</span>.N</div>
        <div class="nav-actions">
            <button class="icon-btn" onclick="alert('暂无新通知')">🔔<span class="badge-dot"></span></button>
            <a href="member.html" style="font-size:14px; color:var(--text-muted); text-decoration:none;">返回</a>
        </div>
    </header>

    <main class="container">
        <div style="margin-bottom:14px;">
            <div style="font-size:17px; font-weight:600; color:var(--text-main);">📰 PUBG 官方资讯</div>
            <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">数据来源：PUBG 官方新闻</div>
        </div>

        <div id="newsList">
            <div class="empty-state"><div class="icon">⏳</div><p>加载中...</p></div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="member.html"><span class="nav-icon">🏠</span>首页</a>
        <a href="leaderboard.html"><span class="nav-icon">📊</span>榜单</a>
        <a href="registration.html"><span class="nav-icon">📝</span>报名</a>
        <a href="news.html" class="active"><span class="nav-icon">📰</span>资讯</a>
        <a href="profile.html"><span class="nav-icon">👤</span>我的</a>
    </nav>

    <script>
        // ===== 新闻数据（可后续对接API） =====
        const newsData = [
            { title: '第26赛季即将开启，全新地图"沙漠绿洲"上线', summary: '全新的沙漠绿洲地图为玩家带来了前所未有的战术体验，包含3个全新地标和动态沙暴系统。', time: '2026-07-27 14:30', source: 'PUBG 官方公告', tag: '新版本' },
            { title: 'DMN 夏季赛报名通道正式开启', summary: 'DMN 夏季赛将于8月1日正式开赛，本次赛事总奖金池高达50,000元，报名截止7月30日。', time: '2026-07-26 10:00', source: 'DMN 赛事组', tag: '赛事' },
            { title: 'PUBG x 知名运动品牌联名皮肤即将上线', summary: '全新联名系列皮肤包含专属战术头盔、背包及武器皮肤，限时发售，敬请期待。', time: '2026-07-25 18:45', source: 'PUBG 官方公告', tag: '联名' },
            { title: '第25赛季结算公告：段位重置与奖励发放', summary: '第25赛季将于8月1日正式结算，所有玩家将根据当前段位获得对应奖励，段位将进行软重置。', time: '2026-07-24 12:00', source: 'PUBG 官方公告', tag: '赛季结算' },
            { title: 'DMN 联赛新增"最佳新人"奖项', summary: '为鼓励新选手，DMN 联赛决定新增"最佳新人"奖项，获奖者将获得专属勋章及现金奖励。', time: '2026-07-23 09:20', source: 'DMN 赛事组', tag: '赛事' },
        ];

        function renderNews() {
            const container = document.getElementById('newsList');
            let html = '';
            newsData.forEach(item => {
                html += `
                    <div class="news-card" onclick="window.open('https://www.pubg.com','_blank')">
                        <div class="source">📌 ${item.source}</div>
                        <div class="title">${item.title}</div>
                        <div class="summary">${item.summary}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                            <span class="time">🕐 ${item.time}</span>
                            <span class="tag">${item.tag}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'index.html';
                return;
            }
            renderNews();
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js');
        }
    </script>
</body>
</html>
