<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.M.N 队员中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0f1419;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }
        header {
            background-color: #101c32;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 22px;
        }
        .header-logo {
            font-size: 24px;
            font-weight: bold;
            color: #fcd322;
        }
        .header-nav a {
            color: #cccccc;
            text-decoration: none;
            margin: 0 9px;
            font-size: 15px;
        }
        .header-nav a.active {
            color: #fcd322;
        }
        .logout-btn {
            color: #ff4c4c;
            text-decoration: none;
        }
        .wrap {
            max-width: 1240px;
            margin: 32px auto;
            padding: 0 22px;
        }
        .top-select-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom:16px;
        }
        .top-select-bar select {
            background:#19212c;
            color:#fff;
            border:1px solid #666;
            border-radius:6px;
            padding:5px 10px;
        }
        .module-title {
            font-size:18px;
            font-weight:bold;
            color:#fcd322;
            margin-bottom:14px;
        }
        .data-card-row {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap:16px;
            margin-bottom:26px;
        }
        .data-card {
            background:#182029;
            border:1px solid #28303c;
            border-radius:10px;
            padding:20px;
        }
        .data-card small {
            color:#aaaaaa;
            font-size:13px;
        }
        .data-card .num-val {
            font-size:34px;
            font-weight:bold;
            color:#fcd322;
            margin:6px 0;
        }
        .radar-container {
            background:#182029;
            border:1px solid #28303c;
            border-radius:10px;
            padding:24px;
            max-width:660px;
            margin-bottom:32px;
        }
        .block-panel {
            background:#182029;
            border:1px solid #28303c;
            border-radius:10px;
            padding:24px;
            margin-bottom:32px;
        }
        .block-panel h3 {
            font-size:20px;
            font-weight:bold;
            margin-bottom:18px;
        }
        .btn-yellow {
            background:#fcd322;
            color:#000000;
            border:none;
            border-radius:6px;
            padding:9px 20px;
            font-weight:bold;
        }
        .btn-dark {
            background:#27303d;
            color:#fff;
            border:none;
            border-radius:6px;
            padding:9px 20px;
            margin:0 4px;
        }
        .empty-tip {
            color:#999999;
            text-align:center;
            padding:24px 0;
        }
        table{
            width:100%;
            border-collapse: collapse;
        }
        table th,table td{
            border:1px solid #28303c;
            padding:12px;
            text-align:center;
            font-size:14px;
        }
        table th{
            background:#202935;
            color:#fcd322;
        }
    </style>
</head>
<body>
<header>
    <div class="header-logo">D.M.N</div>
    <div class="header-nav">
        <a href="#" class="active">队员中心</a>
        <a href="ranks.html">排行榜</a>
        <a href="#">我的战队</a>
        <a href="#">比赛回放</a>
        <a href="#">赞助公示</a>
    </div>
    <a href="#" class="logout-btn">退出登录</a>
</header>

<div class="wrap">
    <div class="top-select-bar">
        <select>
            <option>全部比赛（生涯汇总）</option>
        </select>
    </div>

    <h2 class="module-title">个人生涯数据</h2>
    <div class="data-card-row">
        <div class="data-card">
            <small>生涯 KD</small>
            <div class="num-val">1.09</div>
            <small>PUBG 赛事数据同步后显示</small>
        </div>
        <div class="data-card">
            <small>总击杀</small>
            <div class="num-val">12</div>
            <small>累计击杀数</small>
        </div>
        <div class="data-card">
            <small>总场次</small>
            <div class="num-val">12</div>
            <small>参赛对局数</small>
        </div>
        <div class="data-card">
            <small>吃鸡数</small>
            <div class="num-val">0</div>
            <small>获得第一名次数</small>
        </div>
    </div>

    <h2 class="module-title">个人综合能力雷达图</h2>
    <div class="radar-container">
        <canvas id="abilityRadar"></canvas>
    </div>

    <h2 class="module-title">近期比赛战绩</h2>
    <div class="block-panel">
        <table>
            <thead>
                <tr>
                    <th>对局日期</th>
                    <th>赛事名称</th>
                    <th>名次</th>
                    <th>击杀</th>
                    <th>伤害</th>
                    <th>存活时长</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>2026-07-24</td>
                    <td>DMN友谊赛</td>
                    <td>第5名</td>
                    <td>2</td>
                    <td>345</td>
                    <td>18分22秒</td>
                </tr>
                <tr>
                    <td>2026-07-23</td>
                    <td>DMN友谊赛</td>
                    <td>第8名</td>
                    <td>1</td>
                    <td>211</td>
                    <td>12分05秒</td>
                </tr>
            </tbody>
        </table>
    </div>

    <h2 class="module-title">我的战队</h2>
    <div class="block-panel">
        <h3>当前战队信息</h3>
        <p class="empty-tip">暂未加入战队，或本赛季战队数据未同步。</p>
        <button class="btn-yellow">查看战队</button>
    </div>

    <h2 class="module-title">赛事赞助公示</h2>
    <div class="block-panel">
        <h3>赞助与奢侈税记录</h3>
    </div>
</div>

<script>
//注释
let radarChartInstance = null;
function initRadarChart(dataArr) {
    const canvas = document.getElementById("abilityRadar");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (radarChartInstance) {
        radarChartInstance.destroy();
    }
    radarChartInstance = new Chart(ctx, {
        type: "radar",
        data: {
            labels: ["场均击杀", "场均伤害", "生存能力", "命中率", "投掷物使用率"],
            datasets: [{
                label: "本赛季综合能力",
                data: dataArr,
                backgroundColor: "rgba(252, 211, 34, 0.12)",
                borderColor: "#fcd322",
                pointBackgroundColor: "#fcd322",
                pointBorderColor: "#000000",
                pointRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            scales: {
                r: {
                    min: 0,
                    max: 100,
                    ticks: { display: false },
                    grid: { color: "#303946" },
                    angleLines: { color: "#303946" }
                }
            },
            plugins: {
                legend: { labels: { color: "#dddddd" } }
            }
        }
    });
}

async function loadPlayerRadarData() {
    const username = "YvainCC";
    try {
        const res = await fetch(`/api/playerData?username=${encodeURIComponent(username)}`);
        const json = await res.json();
        if (json.ok && Array.isArray(json.radar)) {
            initRadarChart(json.radar);
        } else {
            initRadarChart([62, 70, 66, 55, 60]);
        }
    } catch (err) {
        console.error("雷达图加载失败", err);
        initRadarChart([62, 70, 66, 55, 60]);
    }
}

window.addEventListener("load", loadPlayerRadarData);
</script>
</body>
</html>
