<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D.M.N 战队队员中心</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0f1419;
            color: #f0f2f5;
        }
        header {
            background: linear-gradient(135deg, #1a2a48 0%, #0f1419 100%);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3342;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffd700;
        }
        .nav-links {
            display: flex;
            gap: 24px;
        }
        .nav-links a {
            color: #b8c2cc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #ffd700;
        }
        .logout {
            color: #ff5555;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 16px;
        }
        .season-select-wrap {
            text-align: right;
            margin-bottom: 10px;
        }
        #seasonSelect {
            padding: 6px 12px;
            background: #1a2430;
            color: #fff;
            border: 1px solid #2a3342;
            border-radius: 6px;
            font-size: 14px;
        }
        .section-title {
            font-size: 18px;
            margin: 24px 0 16px;
            color: #ffd700;
            font-weight: 700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .card {
            background: #1a2430;
            border: 1px solid #2a3342;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
        }
        .card-title {
            font-size: 13px;
            color: #8b95a5;
            margin-bottom: 8px;
        }
        .card-value {
            font-size: 28px;
            font-weight: 800;
            color: #ffd700;
        }
        .card-sub {
            font-size: 12px;
            color: #6e7888;
            margin-top: 6px;
        }
        .panel {
            background: #1a2430;
            border: 1px solid #2a3342;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .panel h3 {
            font-size: 20px;
            margin-bottom: 18px;
            color: #fff;
        }
        /* 雷达图容器 缩小+居中 模仿小黑盒 */
        .radar-wrap {
            max-width: 520px;
            margin: 0 auto;
        }
        table{
            width:100%;
            border-collapse: collapse;
        }
        table th,table td{
            border:1px solid #2a3342;
            padding:12px;
            text-align:center;
            font-size:14px;
        }
        table th{
            background:#222d3b;
            color:#ffd700;
        }
        .btn {
            display: inline-block;
            background: #ffd700;
            color: #0f1419;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
        }
        .btn:hover {
            background: #ffed4e;
        }
        .empty {
            color: #7d8898;
            padding: 30px 0;
            text-align: center;
            font-size: 14px;
        }
        /* 移动端适配 */
        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .nav-links {
                gap: 12px;
            }
            .nav-links a {
                font-size: 12px;
            }
            .radar-wrap {
                max-width: 100%;
            }
        }
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 12px;
            }
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="logo">D.M.N</div>
    <nav class="nav-links">
        <a href="member.html" class="active">队员中心</a>
        <a href="ranks.html">排行榜</a>
        <a href="team.html">我的战队</a>
        <a href="#">比赛回放</a>
        <a href="#">赞助公示</a>
    </nav>
    <div class="logout" onclick="logout()">退出登录</div>
</header>
<div class="container">
    <div class="season-select-wrap">
        <select id="seasonSelect">
            <option value="all">全部比赛（生涯汇总）</option>
            <option value="S5">S5赛季</option>
            <option value="S6">S6赛季</option>
        </select>
    </div>

    <div class="section-title">个人生涯数据</div>
    <div class="grid">
        <div class="card">
            <div class="card-title">生涯 KD</div>
            <div class="card-value" id="kdVal">--</div>
            <div class="card-sub">PUBG 赛事数据同步后显示</div>
        </div>
        <div class="card">
            <div class="card-title">总击杀</div>
            <div class="card-value" id="killVal">--</div>
            <div class="card-sub">累计击杀数</div>
        </div>
        <div class="card">
            <div class="card-title">总场次</div>
            <div class="card-value" id="matchVal">--</div>
            <div class="card-sub">参赛对局数</div>
        </div>
        <div class="card">
            <div class="card-title">吃鸡数</div>
            <div class="card-value" id="winVal">--</div>
            <div class="card-sub">获得第一名次数</div>
        </div>
    </div>

    <div class="section-title">个人综合能力雷达图</div>
    <div class="panel radar-wrap">
        <canvas id="abilityRadar"></canvas>
    </div>

    <div class="section-title">近期比赛战绩</div>
    <div class="panel">
        <table>
            <thead>
                <tr>
                    <th>对局日期</th>
                    <th>赛事名称</th>
                    <th>名次</th>
                    <th>击杀</th>
                    <th>伤害</th>
                    <th>存活时长</th>
                </tr>
            </thead>
            <tbody id="matchTableBody">
                <tr>
                    <td colspan="6" class="empty">加载对局数据...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="section-title">我的战队</div>
    <div class="panel">
        <h3>当前战队信息</h3>
        <div class="empty">
            暂未加入战队，或本赛季战队数据未同步。
        </div>
        <a href="team.html" class="btn">查看战队</a>
    </div>

    <div class="section-title">赛事赞助公示</div>
    <div class="panel">
        <h3>赞助与奢侈税记录</h3>
        <div class="empty">
            本赛季赞助流水、老板赞助、奢侈税记录将在此展示。
        </div>
        <a href="#" class="btn">查看公示</a>
    </div>
</div>

<script>
let radarChartInstance = null;
const radarLabels = ["场均击杀", "场均伤害", "生存能力", "命中率", "投掷物使用率"];

function initRadarChart(dataArr) {
    const canvas = document.getElementById("abilityRadar");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (radarChartInstance) radarChartInstance.destroy();

    radarChartInstance = new Chart(ctx, {
        type: "radar",
        data: {
            labels: radarLabels,
            datasets: [{
                label: "本赛季综合能力",
                data: dataArr,
                backgroundColor: "rgba(255, 215, 0, 0.12)",
                borderColor: "#ffd700",
                pointBackgroundColor: "#ffd700",
                pointBorderColor: "#000",
                pointRadius: 5
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            scales: {
                r: {
                    min:0,
                    max:100,
                    ticks:{
                        display: false
                    },
                    grid:{color:"#2a3342"},
                    angleLines:{color:"#2a3342"}
                }
            },
            plugins:{
                legend:{
                    labels:{color:"#ddd"}
                },
                tooltip:{
                    callbacks:{
                        label:function(context){
                            return context.label + "：" + context.raw + " 分";
                        }
                    }
                }
            }
        }
    })
}

function logout() {
    localStorage.removeItem("loginUser");
    window.location.href = "index.html";
}
let currentSeason = "all";
window.onload = function () {
    const userName = localStorage.getItem("loginUser");
    if (!userName) {
        window.location.href = "index.html";
        return;
    }
    loadPlayerStats();
    seasonSelect.addEventListener("change", function () {
        currentSeason = this.value;
        loadPlayerStats();
    })
}
async function loadPlayerStats() {
    const userName = localStorage.getItem("loginUser");
    document.getElementById("kdVal").innerText = "--";
    document.getElementById("killVal").innerText = "--";
    document.getElementById("matchVal").innerText = "--";
    document.getElementById("winVal").innerText = "--";
    try {
        const res = await fetch(`/api/playerData?username=${userName}&season=${currentSeason}`);
        const json = await res.json();
        if (!json.ok || !json.data) {
            initRadarChart([62,70,66,55,60]);
            return;
        }
        const info = json.data;
        if (info.historical_total_kd && info.historical_total_kd > 0) {
            document.getElementById("kdVal").innerText = info.historical_total_kd;
        }
        document.getElementById("killVal").innerText = info.total_kill ?? 0;
        document.getElementById("matchVal").innerText = info.total_match ?? 0;
        document.getElementById("winVal").innerText = info.total_win ?? 0;

        if(Array.isArray(json.radar)){
            initRadarChart(json.radar);
        }else{
            initRadarChart([62,70,66,55,60]);
        }

        const tbody = document.getElementById("matchTableBody");
        if(Array.isArray(json.matches) && json.matches.length>0){
            tbody.innerHTML = "";
            json.matches.forEach(item=>{
                const tr = document.createElement("tr");
                tr.innerHTML = `
                <td>${item.time}</td>
                <td>${item.event}</td>
                <td>第${item.rank}名</td>
                <td>${item.kills}</td>
                <td>${item.damage}</td>
                <td>${item.survive}</td>
                `;
                tbody.appendChild(tr);
            })
        }
    } catch (err) {
        console.error(err);
        initRadarChart([62,70,66,55,60]);
    }
}
</script>
</body>
</html>
