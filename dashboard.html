<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.M.N 队员中心</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background:#0f1720;
    color:#fff;
    font-family:system-ui, sans-serif;
}
header{
    background:#111b2e;
    padding:14px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo{
    font-size:24px;
    font-weight:bold;
    color:#facc15;
}
.nav a{
    color:#cccccc;
    margin:0 10px;
    text-decoration:none;
    font-size:15px;
}
.nav a.active{
    color:#facc15;
}
.logout{
    color:#ff5555;
    text-decoration:none;
}
.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 24px;
}
.title-text{
    color:#facc15;
    font-size:18px;
    font-weight:bold;
    margin-bottom:16px;
}
.card-row{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:16px;
    margin-bottom:30px;
}
.card{
    background:#18202c;
    border-radius:10px;
    padding:20px;
    border:1px solid #242e3f;
}
.card small{
    color:#aaa;
}
.card .num{
    font-size:32px;
    color:#facc15;
    font-weight:bold;
    margin:6px 0;
}
.block{
    background:#18202c;
    border-radius:10px;
    padding:24px;
    border:1px solid #242e3f;
    margin-bottom:30px;
}
.btn-yellow{
    background:#facc15;
    color:#000;
    border:none;
    padding:10px 22px;
    border-radius:6px;
    font-weight:bold;
}
.btn-dark{
    background:#283244;
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:6px;
    margin:0 4px;
}
.radar-wrap{
    background:#18202c;
    border-radius:10px;
    padding:24px;
    max-width:640px;
    border:1px solid #242e3f;
}
</style>
</head>
<body>
<header>
    <div class="logo">D.M.N</div>
    <div class="nav">
        <a href="#" class="active">队员中心</a>
        <a href="ranks.html">排行榜</a>
        <a href="#">我的战队</a>
        <a href="#">比赛回放</a>
        <a href="#">赞助公示</a>
    </div>
    <a class="logout" href="#">退出登录</a>
</header>

<div class="container">
    <div style="display:flex; justify-content:flex-end; margin-bottom:16px;">
        <select style="background:#18202c;color:#fff;padding:6px 10px;border-radius:6px;border:1px solid #333;">
            <option>全部比赛（生涯汇总）</option>
        </select>
    </div>

    <h2 class="title-text">个人生涯数据</h2>
    <div class="card-row">
        <div class="card">
            <small>生涯 KD</small>
            <div class="num">1.09</div>
            <small>PUBG 赛事数据同步后显示</small>
        </div>
        <div class="card">
            <small>总击杀</small>
            <div class="num">12</div>
            <small>累计击杀数</small>
        </div>
        <div class="card">
            <small>总场次</small>
            <div class="num">12</div>
            <small>参赛对局数</small>
        </div>
        <div class="card">
            <small>吃鸡数</small>
            <div class="num">0</div>
            <small>获得第一名次数</small>
        </div>
    </div>

    <!-- 个人综合能力雷达图 -->
    <h2 class="title-text">个人综合能力雷达图</h2>
    <div class="radar-wrap">
        <canvas id="abilityRadar"></canvas>
    </div>

    <h2 class="title-text" style="margin-top:30px;">排行榜快速入口</h2>
    <div class="block">
        <h3 style="font-size:20px; font-weight:bold; margin-bottom:16px;">DMN 赛事榜单</h3>
        <div>
            <button class="btn-yellow">战神榜</button>
            <button class="btn-dark">伤害榜</button>
            <button class="btn-dark">吃鸡榜</button>
            <button class="btn-dark">战队榜</button>
        </div>
    </div>

    <h2 class="title-text">我的战队</h2>
    <div class="block">
        <h3 style="font-size:20px; font-weight:bold; margin-bottom:16px;">当前战队信息</h3>
        <p style="text-align:center; color:#aaa; padding:20px 0;">暂未加入战队，或本赛季战队数据未同步。</p>
        <button class="btn-yellow">查看战队</button>
    </div>

    <h2 class="title-text">赛事赞助公示</h2>
    <div class="block">
        <h3 style="font-size:20px; font-weight:bold;">赞助与奢侈税记录</h3>
    </div>
</div>

<script>
let radarChartInstance = null;

function initRadarChart(dataArr) {
    const canvas = document.getElementById("abilityRadar");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (radarChartInstance) {
        radarChartInstance.destroy();
    }
    radarChartInstance = new Chart(ctx, {
        type: "radar",
        data: {
            labels: ["场均击杀", "场均伤害", "生存能力", "命中率", "投掷物使用率"],
            datasets: [{
                label: "本赛季综合能力",
                data: dataArr,
                backgroundColor: "rgba(250, 204, 21, 0.12)",
                borderColor: "#facc15",
                pointBackgroundColor: "#facc15",
                pointBorderColor: "#000000",
                pointRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            scales: {
                r: {
                    min: 0,
                    max: 100,
                    ticks: { display: false },
                    grid: { color: "#333b48" },
                    angleLines: { color: "#333b48" }
                }
            },
            plugins: {
                legend: {
                    labels: { color: "#dddddd" }
                }
            }
        }
    });
}

async function loadPlayerRadar() {
    const username = "YvainCC";
    try {
        const res = await fetch(`/api/playerData?username=${encodeURIComponent(username)}`);
        const json = await res.json();
        if (json.ok && Array.isArray(json.radar)) {
            initRadarChart(json.radar);
        } else {
            initRadarChart([62, 70, 66, 55, 60]);
        }
    } catch (err) {
        console.error("雷达加载失败", err);
        initRadarChart([62, 70, 66, 55, 60]);
    }
}

window.onload = function () {
    loadPlayerRadar();
};
</script>
</body>
</html>
