<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台 | D.M.N</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0f1419;
            color: #f0f2f5;
        }
        header {
            background: linear-gradient(135deg, #1a2a48 0%, #0f1419 100%);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3342;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffd700;
        }
        .nav-links {
            display: flex;
            gap: 24px;
        }
        .nav-links a {
            color: #b8c2cc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-links a:hover,.nav-links a.active {
            color: #ffd700;
        }
        .logout {
            color: #ff5555;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 16px;
        }
        .tab-wrap{
            display:flex;
            gap:10px;
            margin-bottom:20px;
        }
        .tab-btn{
            padding:10px 18px;
            background:#2a3342;
            border:none;
            border-radius:8px;
            color:#b8c2cc;
            cursor:pointer;
        }
        .tab-btn.active{
            background:#ffd700;
            color:#000;
        }
        .panel {
            background: #1a2430;
            border: 1px solid #2a3342;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .panel h3 {
            font-size: 20px;
            margin-bottom: 18px;
            color: #fff;
        }
        table{
            width:100%;
            border-collapse: separate;
            border-spacing:0 8px;
        }
        th{
            color:#888;
            text-align:left;
            padding:6px 10px;
            font-size:13px;
        }
        td{
            background:#222d3b;
            padding:12px 10px;
            font-size:14px;
        }
        td:first-child{border-radius:6px 0 0 6px;}
        td:last-child{border-radius:0 6px 6px 0;}
        .btn{
            padding:6px 10px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            margin:0 3px;
        }
        .btn-pass{background:#39b54a;color:#000;}
        .btn-reject{background:#ff4444;color:#fff;}
        .btn-edit{background:#ffd700;color:#000;}
        .input-row{
            display:grid;
            grid-template-columns: repeat(6,1fr);
            gap:10px;
            margin:15px 0;
        }
        input{
            height:40px;
            padding:0 10px;
            background:#222d3b;
            border:1px solid #333;
            border-radius:6px;
            color:#fff;
        }
        .save-btn{
            background:#ffd700;
            color:#000;
            padding:8px 22px;
            border:none;
            border-radius:6px;
            font-weight:bold;
        }
        .empty{
            text-align:center;
            padding:30px;
            color:#777;
        }
        @media (max-width:768px){
            .input-row{grid-template-columns: 1fr 1fr;}
            header{flex-direction:column;gap:12px}
        }
    </style>
</head>
<body>
<header>
    <div class="logo">D.M.N 管理后台</div>
    <nav class="nav-links">
        <a href="member.html">队员中心</a>
        <a href="ranks.html">排行榜</a>
        <a href="team.html">我的战队</a>
        <a href="admin.html" class="active">管理后台</a>
        <a href="#">比赛回放</a>
        <a href="#">赞助公示</a>
    </nav>
    <div class="logout" onclick="logout()">退出登录</div>
</header>
<div class="container">
    <div class="tab-wrap">
        <button class="tab-btn active" data-tab="playerEdit">选手KD录入</button>
        <button class="tab-btn" data-tab="auditRegister">战队报名审核</button>
    </div>

    <!-- 选手数据录入面板 -->
    <div class="panel" id="playerEditPanel">
        <h3>选手KD数据手动录入/修改</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>选手账号</th>
                    <th>总击杀</th>
                    <th>总场次</th>
                    <th>吃鸡数</th>
                    <th>总伤害</th>
                    <th>KD</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="playerTableBody">
                <tr><td colspan="8" class="empty">加载中...</td></tr>
            </tbody>
        </table>
        <!-- 编辑弹窗行 -->
        <div id="editForm" style="display:none;margin-top:20px;border-top:1px solid #333;padding-top:20px;">
            <h4>修改选手数据 <span id="editUserName"></span></h4>
            <input type="hidden" id="editPlayerId">
            <div class="input-row">
                <input placeholder="总击杀" id="editKill">
                <input placeholder="总场次" id="editMatch">
                <input placeholder="吃鸡数量" id="editWin">
                <input placeholder="总伤害" id="editDmg">
                <input placeholder="历史KD" id="editKd">
            </div>
            <button class="save-btn" onclick="savePlayerEdit()">保存修改</button>
        </div>
    </div>

    <!-- 报名审核面板 -->
    <div class="panel" id="auditPanel" style="display:none;">
        <h3>赛季战队报名审核</h3>
        <table>
            <thead>
                <tr>
                    <th>报名ID</th>
                    <th>战队名称</th>
                    <th>首发总KD</th>
                    <th>奢侈税</th>
                    <th>提交时间</th>
                    <th>当前状态</th>
                    <th>审核操作</th>
                </tr>
            </thead>
            <tbody id="regTableBody">
                <tr><td colspan="7" class="empty">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>
<script>
const adminName = "test";
let currentEditPlayerId = null;

function logout(){
    window.location.href="index.html"
}
// 切换tab
document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.onclick = ()=>{
        document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        document.getElementById("playerEditPanel").style.display = tab === "playerEdit" ? "block" : "none";
        document.getElementById("auditPanel").style.display = tab === "auditRegister" ? "block" : "none";
        if(tab === "playerEdit") loadPlayerList();
        if(tab === "auditRegister") loadRegList();
    }
})

// 加载全部选手
async function loadPlayerList(){
    const res = await fetch(`/api/adminManage?opt=playerList`);
    const json = await res.json();
    const body = document.getElementById("playerTableBody");
    if(!json.ok || json.list.length ===0){
        body.innerHTML = `<tr><td colspan="8" class="empty">暂无选手数据</td></tr>`;
        return;
    }
    let html = "";
    json.list.forEach(item=>{
        html += `
        <tr>
            <td>${item.id}</td>
            <td>${item.username}</td>
            <td>${item.total_kill || 0}</td>
            <td>${item.total_match || 0}</td>
            <td>${item.total_win || 0}</td>
            <td>${item.total_damage || 0}</td>
            <td>${item.historical_total_kd || 0}</td>
            <td><button class="btn btn-edit" onclick="openEdit(${item.id},'${item.username}',${item.total_kill||0},${item.total_match||0},${item.total_win||0},${item.total_damage||0},${item.historical_total_kd||0})">编辑</button></td>
        </tr>`
    })
    body.innerHTML = html;
}

// 打开选手编辑表单
function openEdit(pid, uname, kill, match, win, dmg, kd){
    currentEditPlayerId = pid;
    document.getElementById("editForm").style.display = "block";
    document.getElementById("editUserName").innerText = uname;
    document.getElementById("editPlayerId").value = pid;
    document.getElementById("editKill").value = kill;
    document.getElementById("editMatch").value = match;
    document.getElementById("editWin").value = win;
    document.getElementById("editDmg").value = dmg;
    document.getElementById("editKd").value = kd;
}

// 保存选手修改
async function savePlayerEdit(){
    const pid = document.getElementById("editPlayerId").value;
    const kill = document.getElementById("editKill").value;
    const match = document.getElementById("editMatch").value;
    const win = document.getElementById("editWin").value;
    const dmg = document.getElementById("editDmg").value;
    const kd = document.getElementById("editKd").value;
    const res = await fetch("/api/adminManage",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            adminName:adminName,
            type:"editPlayerStat",
            playerId:pid,
            total_kill:Number(kill),
            total_match:Number(match),
            total_win:Number(win),
            total_damage:Number(dmg),
            historical_total_kd:Number(kd)
        })
    })
    const ret = await res.json();
    alert(ret.msg);
    if(ret.ok){
        document.getElementById("editForm").style.display = "none";
        loadPlayerList();
    }
}

// 加载报名审核列表
async function loadRegList(){
    const res = await fetch(`/api/adminManage?opt=regList`);
    const json = await res.json();
    const body = document.getElementById("regTableBody");
    if(!json.ok || json.list.length ===0){
        body.innerHTML = `<tr><td colspan="7" class="empty">暂无报名记录</td></tr>`;
        return;
    }
    let html = "";
    json.list.forEach(item=>{
        let statusText = "";
        if(item.status === "pending") statusText = "待审核";
        if(item.status === "pass") statusText = "审核通过";
        if(item.status === "reject") statusText = "已驳回";
        html += `
        <tr>
            <td>${item.id}</td>
            <td>${item.team_name}</td>
            <td>${item.sum_kd_at_submit}</td>
            <td>${item.luxury_tax}</td>
            <td>${item.create_time}</td>
            <td>${statusText}</td>
            <td>
                <button class="btn btn-pass" onclick="auditReg(${item.id},'pass')">通过</button>
                <button class="btn btn-reject" onclick="auditReg(${item.id},'reject')">驳回</button>
            </td>
        </tr>`
    })
    body.innerHTML = html;
}

// 执行报名审核
async function auditReg(regId, status){
    const confirmTip = status === "pass" ? "确认通过该战队报名？" : "确认驳回该战队报名？";
    if(!confirm(confirmTip)) return;
    const res = await fetch("/api/adminManage",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            adminName:adminName,
            type:"auditReg",
            regId:regId,
            newStatus:status
        })
    })
    const ret = await res.json();
    alert(ret.msg);
    if(ret.ok) loadRegList();
}

// 页面初始化加载选手列表
window.onload = ()=> loadPlayerList();
</script>
</body>
</html>
