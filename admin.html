<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMN 后台管理</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a2a48">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
        body { background:#f5f7fa; padding:20px; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .admin-container { background:#fff; max-width:600px; width:100%; padding:30px; border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,0.08); }
        h1 { font-size:24px; color:#1a2a48; margin-bottom:8px; }
        h1 span { color:#c9a84c; }
        p { color:#8e98a3; margin-bottom:20px; }
        .upload-area { border:2px dashed #d0d7de; border-radius:12px; padding:30px; text-align:center; cursor:pointer; transition:0.2s; }
        .upload-area:hover { border-color:#c9a84c; background:#fafbfc; }
        .upload-area input[type="file"] { display:none; }
        .upload-area .label { font-size:16px; color:#4a4a5a; }
        .upload-area .hint { font-size:13px; color:#b0b8c4; margin-top:4px; }
        #status { margin-top:16px; padding:12px; border-radius:8px; display:none; }
        #status.success { background:#e6f7ed; color:#0f9d58; display:block; }
        #status.error { background:#fef0ef; color:#ea4335; display:block; }
        #status.info { background:#e8f0fe; color:#1a73e8; display:block; }
        .btn-upload { margin-top:16px; width:100%; padding:12px; background:#1a2a48; color:white; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; }
        .btn-upload:disabled { opacity:0.5; cursor:not-allowed; }
        .btn-back { display:inline-block; margin-top:16px; color:#8e98a3; text-decoration:none; }
        .btn-back:hover { text-decoration:underline; }
    </style>
</head>
<body>
<div class="admin-container">
    <h1>D<span style="color:#c9a84c;">M</span>N · 后台管理</h1>
    <p>导入人员数据（Excel .xlsx 格式）</p>

    <div class="upload-area" id="dropZone">
        <input type="file" id="fileInput" accept=".xlsx,.xls">
        <div class="label">📁 点击选择 Excel 文件</div>
        <div class="hint">支持 .xlsx / .xls，表头需包含：玩家账号ID、玩家名称、历史名称</div>
    </div>

    <button class="btn-upload" id="uploadBtn" disabled>上传并导入</button>
    <div id="status"></div>
    <a href="/member" class="btn-back">← 返回队员中心</a>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusDiv = document.getElementById('status');

    let selectedFile = null;

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            uploadBtn.disabled = false;
            showStatus('已选择: ' + selectedFile.name, 'info');
        }
    });

    uploadBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        uploadBtn.disabled = true;
        uploadBtn.textContent = '导入中...';
        showStatus('正在上传并导入...', 'info');

        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
            const res = await fetch('/api/admin/import', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (res.ok && data.ok) {
                showStatus('✅ 导入成功！共导入 ' + (data.count || '未知') + ' 条记录', 'success');
            } else {
                showStatus('❌ 导入失败: ' + (data.msg || '未知错误'), 'error');
            }
        } catch (err) {
            showStatus('❌ 网络错误: ' + err.message, 'error');
        } finally {
            uploadBtn.disabled = false;
            uploadBtn.textContent = '上传并导入';
            selectedFile = null;
            fileInput.value = '';
        }
    });

    function showStatus(msg, type) {
        statusDiv.textContent = msg;
        statusDiv.className = type;
        statusDiv.style.display = 'block';
    }
</script>
</body>
</html>
