<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 战绩导入</title>
    <!-- 引入 SheetJS 用于解析 Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0f1419;
            color: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #ffd700;
            margin-bottom: 8px;
        }
        .sub-title {
            color: #8b95a5;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .back-link {
            color: #8b95a5;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .back-link:hover {
            color: #ffd700;
        }
        .upload-area {
            background: #1a2430;
            border: 2px dashed #2a3342;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .upload-area input[type="file"] {
            display: block;
            margin: 16px auto;
            color: #ccc;
            cursor: pointer;
            font-size: 14px;
        }
        .upload-area .btn {
            background: #ffd700;
            color: #0f1419;
            border: none;
            padding: 10px 30px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: .2s;
        }
        .upload-area .btn:disabled {
            background: #5a5a5a;
            color: #888;
            cursor: not-allowed;
        }
        .upload-area .btn:hover:not(:disabled) {
            background: #e6c200;
        }
        .progress-wrap {
            background: #222d3b;
            border-radius: 10px;
            height: 24px;
            overflow: hidden;
            margin: 16px 0;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #ffd700;
            transition: width 0.3s;
            text-align: center;
            line-height: 24px;
            color: #0f1419;
            font-weight: bold;
            font-size: 13px;
        }
        .log-box {
            background: #1a2430;
            border: 1px solid #2a3342;
            border-radius: 8px;
            padding: 12px;
            max-height: 350px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            color: #b8c2cc;
            margin-top: 16px;
        }
        .log-box .success { color: #7bed9f; }
        .log-box .error { color: #ff6b81; }
        .log-box .info { color: #70a1ff; }
        .log-box .warn { color: #feca57; }
        .permission-denied {
            color: #ff6b81;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding: 30px 0;
        }
        .file-info {
            color: #8b95a5;
            font-size: 13px;
            margin-top: 6px;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="member.html" class="back-link">← 返回队员中心</a>
    <h1>⚙️ 后台管理</h1>
    <p class="sub-title">导入 Excel 战绩数据（支持 .xlsx / .xls）</p>

    <div id="permissionMsg" class="permission-denied" style="display:none;">
        ⛔ 您不是超级管理员，无权访问此功能！
    </div>

    <div id="uploadArea" class="upload-area">
        <p style="color:#8b95a5; margin-bottom:8px;">请选择要导入的 Excel 文件</p>
        <input type="file" id="fileInput" accept=".xlsx,.xls" />
        <div style="margin: 12px 0;">
            <button class="btn" id="uploadBtn">开始导入</button>
        </div>
        <div class="progress-wrap">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        <div id="statusMsg" style="color:#8b95a5; font-size:14px; margin-top:6px;">等待操作...</div>
        <div id="fileInfo" class="file-info"></div>
    </div>

    <div class="log-box" id="logBox">📋 日志将在此显示...</div>
</div>

<script>
    (function() {
        // ========== 权限检查 ==========
        const role = localStorage.getItem('userRole');
        const uploadArea = document.getElementById('uploadArea');
        const permissionMsg = document.getElementById('permissionMsg');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressBar = document.getElementById('progressBar');
        const statusMsg = document.getElementById('statusMsg');
        const logBox = document.getElementById('logBox');
        const fileInfo = document.getElementById('fileInfo');

        // 非管理员直接拒绝
        if (role !== 'admin') {
            permissionMsg.style.display = 'block';
            uploadArea.style.display = 'none';
            logBox.innerHTML = '<span class="error">⛔ 您不是超级管理员，无权访问后台！</span>';
            return;
        }

        // ========== 工具函数 ==========
        function appendLog(text, type = 'info') {
            const line = document.createElement('div');
            line.className = type;
            line.textContent = text;
            logBox.appendChild(line);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function setProgress(percent, text) {
            const p = Math.min(percent, 100);
            progressBar.style.width = p + '%';
            progressBar.textContent = Math.round(p) + '%';
            if (text) statusMsg.textContent = text;
        }

        // 文件选择时显示文件名和大小
        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (file) {
                const size = (file.size / 1024 / 1024).toFixed(2);
                fileInfo.textContent = `已选择：${file.name} (${size} MB)`;
                statusMsg.textContent = '已准备就绪，点击 "开始导入"';
                setProgress(0, '待开始');
            } else {
                fileInfo.textContent = '';
                statusMsg.textContent = '等待操作...';
                setProgress(0, '等待文件');
            }
        });

        // ========== 上传按钮事件 ==========
        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                appendLog('❌ 请先选择一个 Excel 文件', 'error');
                return;
            }

            uploadBtn.disabled = true;
            setProgress(0, '正在解析文件...');
            appendLog(`📂 开始解析文件: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`);

            try {
                // 1. 读取 Excel
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data, { type: 'array' });
                let allRows = [];

                // 2. 遍历所有 Sheet
                workbook.SheetNames.forEach(sheetName => {
                    const sheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(sheet);
                    if (rows.length) {
                        appendLog(`📄 Sheet "${sheetName}" 解析到 ${rows.length} 行`);
                        allRows = allRows.concat(rows);
                    }
                });

                if (allRows.length === 0) {
                    appendLog('⚠️ 未解析到任何数据行', 'warn');
                    uploadBtn.disabled = false;
                    setProgress(0, '无数据');
                    return;
                }

                appendLog(`✅ 共解析 ${allRows.length} 条战绩数据，准备分批导入...`);

                // 3. 分批上传（每批 500 条）
                const BATCH_SIZE = 500;
                let totalInserted = 0;
                let errorCount = 0;

                for (let i = 0; i < allRows.length; i += BATCH_SIZE) {
                    const batch = allRows.slice(i, i + BATCH_SIZE);
                    const percent = ((i + batch.length) / allRows.length) * 100;
                    setProgress(percent, `正在导入第 ${i+1} ~ ${i+batch.length} 条...`);

                    const resp = await fetch('/api/import-battles', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(batch)
                    });

                    const result = await resp.json();
                    if (!resp.ok) {
                        throw new Error(result.error || `批次 ${i/BATCH_SIZE+1} 导入失败`);
                    }
                    totalInserted += result.inserted || 0;
                    if (result.errors && result.errors.length > 0) {
                        errorCount += result.errors.length;
                        appendLog(`⚠️ 批次 ${i/BATCH_SIZE+1} 有 ${result.errors.length} 行失败`, 'warn');
                        // 可打印前3个错误详情
                        result.errors.slice(0, 3).forEach(e => {
                            appendLog(`  行 ${e.index}: ${e.error}`, 'error');
                        });
                    }
                    appendLog(`✅ 批次 ${i/BATCH_SIZE+1} 成功写入 ${result.inserted || 0} 条`, 'success');
                }

                if (errorCount > 0) {
                    appendLog(`⚠️ 导入完成，但 ${errorCount} 行数据失败，请检查日志`, 'warn');
                } else {
                    appendLog(`🎉 全部导入完成！共 ${totalInserted} 条战绩已入库`, 'success');
                }
                setProgress(100, `导入完成（成功 ${totalInserted} 条${errorCount > 0 ? `，失败 ${errorCount} 条` : ''}）`);

            } catch (err) {
                appendLog(`❌ 导入失败：${err.message}`, 'error');
                setProgress(0, '导入失败');
            } finally {
                uploadBtn.disabled = false;
            }
        });

        // 初始化日志
        appendLog('✅ 后台已就绪，请选择 Excel 文件开始导入', 'info');
    })();
</script>
</body>
</html>
