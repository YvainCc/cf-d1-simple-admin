<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员操作后台 | D.M.N</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #0f1419;
            color: #f0f2f5;
        }
        header {
            background: linear-gradient(135deg, #1a2a48 0%, #0f1419 100%);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3342;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffd700;
        }
        .nav-links {
            display: flex;
            gap: 24px;
        }
        .nav-links a {
            color: #b8c2cc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-links a:hover,.nav-links a.active {
            color: #ffd700;
        }
        .logout {
            color: #ff5555;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 16px;
        }
        .tab-wrap{
            display:flex;
            gap:10px;
            margin-bottom:20px;
        }
        .tab-btn{
            padding:10px 18px;
            background:#2a3342;
            border:none;
            border-radius:8px;
            color:#b8c2cc;
            cursor:pointer;
        }
        .tab-btn.active{
            background:#ffd700;
            color:#000;
        }
        .panel {
            background: #1a2430;
            border: 1px solid #2a3342;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .panel h3 {
            font-size: 20px;
            margin-bottom: 18px;
            color: #fff;
        }
        table{
            width:100%;
            border-collapse: separate;
            border-spacing:0 8px;
        }
        th{
            color:#888;
            text-align:left;
            padding:6px 10px;
            font-size:13px;
        }
        td{
            background:#222d3b;
            padding:12px 10px;
            font-size:14px;
        }
        td:first-child{border-radius:6px 0 0 6px;}
        td:last-child{border-radius:0 6px 6px 0;}
