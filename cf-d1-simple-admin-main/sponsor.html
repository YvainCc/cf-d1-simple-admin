<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赞助公示 | D.M.N</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0f1419;
            color: #f0f2f5;
        }
        header {
            background: linear-gradient(135deg, #1a2a48 0%, #0f1419 100%);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3342;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffd700;
        }
        .nav-links {
            display: flex;
            gap: 24px;
        }
        .nav-links a {
            color: #b8c2cc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-links a:hover,.nav-links a.active {
            color: #ffd700;
        }
        .logout {
            color: #ff5555;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 16px;
        }
        .panel {
            background: #1a2430;
            border: 1px solid #2a3342;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .panel h3 {
            font-size: 20px;
            margin-bottom: 18px;
            color: #fff;
        }
        .sponsor-card-wrap{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:16px;
        }
        .sponsor-card{
            background:#222d3b;
            border-radius:10px;
            padding:20px;
            border:1px solid #353f52;
        }
        .sponsor-card h4{
            color:#ffd700;
            margin-bottom:8px;
            font-size:16px;
        }
        .sponsor-card p{
            color:#b8c2cc;
            font-size:14px;
            line-height:1.6;
            margin:4px 0;
        }
        .tip-text{
            color:#7d8898;
            font-size:13px;
            margin-top:12px;
        }
        @media (max-width:768px){
            .sponsor-card-wrap{grid-template-columns: 1fr 1fr;}
            header{flex-direction:column;gap:12px}
            .nav-links{flex-wrap:wrap;justify-content:center}
        }
        @media (max-width:480px){
            .sponsor-card-wrap{grid-template-columns: 1fr;}
        }
    </style>
</head>
<body>
<header>
    <div class="logo">D.M.N</div>
    <nav class="nav-links">
        <a href="member.html">队员中心</a>
        <a href="ranks.html">排行榜</a>
        <a href="team.html">我的战队</a>
        <a href="adminIndex.html">后台总览</a>
        <a href="admin.html">操作管理</a>
        <a href="sponsor.html" class="active">赞助公示</a>
    </nav>
    <div class="logout" onclick="logout()">退出登录</div>
</header>
<div class="container">
    <div class="panel">
        <h3>2026 S1赛季 合作赞助商公示</h3>
        <div class="sponsor-card-wrap">
            <div class="sponsor-card">
                <h4>金牌赞助商</h4>
                <p>品牌：XX电竞外设</p>
                <p>赞助内容：赛事奖金池、参赛外设礼品</p>
                <p>赞助周期：2026.01 - 2026.06</p>
            </div>
            <div class="sponsor-card">
                <h4>银牌赞助商</h4>
                <p>品牌：XX电竞网咖</p>
                <p>赞助内容：线下赛事场地、观赛福利</p>
                <p>赞助周期：2026.01 - 2026.06</p>
            </div>
            <div class="sponsor-card">
                <h4>合作伙伴</h4>
                <p>品牌：XX游戏媒体</p>
                <p>赞助内容：赛事直播、赛事宣传推广</p>
                <p>赞助周期：2026.01 - 2026.06</p>
            </div>
        </div>
        <p class="tip-text">后续管理员后台将新增赞助流水台账管理功能，可记录每笔赞助收支与对账信息</p>
    </div>
</div>
<script>
function logout(){
    window.location.href="index.html";
}
</script>
</body>
</html>
