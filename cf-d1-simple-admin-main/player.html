<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人生涯 | PUBG数据中心</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        darkbg:'#111111',
        cardbg:'#1c1c1c',
        primary:'#ea580c',
        textgray:'#aaaaaa'
      }
    }
  }
}
</script>
<style>
body{background:#111111;}
</style>
</head>
<body class="text-gray-200 min-h-screen">
<div class="max-w-6xl mx-auto px-4 py-8">
  <!-- 顶部玩家头部信息 -->
  <div class="bg-[#1c1c1c] rounded-xl p-6 flex flex-wrap items-center gap-6">
    <div class="w-20 h-20 rounded-full bg-[#333] flex items-center justify-center text-3xl font-bold text-orange-500" id="avatarText">
      --
    </div>
    <div>
      <h1 class="text-2xl font-bold" id="playerName">加载中...</h1>
      <div class="flex flex-wrap gap-3 mt-2 text-textgray" id="playerMeta">
        <span>--</span>
      </div>
    </div>
    <div class="ml-auto flex gap-3">
      <button class="px-4 py-2 bg-[#333] rounded-lg hover:bg-[#444] transition">切换赛季</button>
      <button class="px-4 py-2 bg-orange-600 rounded-lg hover:bg-orange-700 transition">查询战绩</button>
    </div>
  </div>

  <!-- 核心数据指标卡片组 -->
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mt-6">
    <div class="bg-[#1c1c1c] rounded-xl p-4 text-center">
      <div class="text-textgray text-sm">总场次</div>
      <div class="text-2xl font-bold mt-1" id="statMatches">--</div>
    </div>
    <div class="bg-[#1c1c1c] rounded-xl p-4 text-center">
      <div class="text-textgray text-sm">吃鸡数</div>
      <div class="text-2xl font-bold mt-1 text-yellow-400" id="statWins">--</div>
    </div>
    <div class="bg-[#1c1c1c] rounded-xl p-4 text-center">
      <div class="text-textgray text-sm">吃鸡率</div>
      <div class="text-2xl font-bold mt-1" id="statWinRate">--</div>
    </div>
    <div class="bg-[#1c1c1c] rounded-xl p-4 text-center">
      <div class="text-textgray text-sm">场均伤害</div>
      <div class="text-2xl font-bold mt-1 text-orange-400" id="statAvgDmg">--</div>
    </div>
    <div class="bg-[#1c1c1c] rounded-xl p-4 text-center">
      <div class="text-textgray text-sm">场均击杀</div>
      <div class="text-2xl font-bold mt-1" id="statAvgKill">--</div>
    </div>
  </div>

  <!-- 雷达图区域 -->
  <div class="bg-[#1c1c1c] rounded-xl p-6 mt-6">
    <h2 class="text-lg font-semibold mb-4">综合能力雷达图</h2>
    <div class="w-full max-w-lg mx-auto">
      <canvas id="radarChart"></canvas>
    </div>
  </div>

  <!-- 赛季详细战绩表格 -->
  <div class="bg-[#1c1c1c] rounded-xl p-6 mt-6">
    <h2 class="text-lg font-semibold mb-4">赛季对局数据</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-[#333] text-textgray">
            <th class="text-left py-3">对局时间</th>
            <th class="text-center py-3">名次</th>
            <th class="text-center py-3">击杀</th>
            <th class="text-center py-3">伤害</th>
            <th class="text-center py-3">存活时长</th>
          </tr>
        </thead>
        <tbody id="matchTableBody">
          <tr><td colspan="5" class="text-center py-6 text-textgray">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
let radarChartInstance = null;

// 创建/更新雷达图
function renderRadar(dataArr) {
  const ctx = document.getElementById("radarChart").getContext("2d");
  if(radarChartInstance){
    radarChartInstance.destroy();
  }
  radarChartInstance = new Chart(ctx, {
    type: "radar",
    data: {
      labels: ["场均击杀","场均伤害","生存能力","命中率","投掷物使用率"],
      datasets: [{
        label:"玩家综合数据",
        data: dataArr,
        backgroundColor:"rgba(234, 88, 12, 0.18)",
        borderColor:"rgba(234, 88, 12, 0.9)",
        pointBackgroundColor:"#ea580c",
        pointBorderColor:"#fff"
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:true,
      scales:{
        r:{
          min:0,max:100,
          ticks:{display:false},
          grid:{color:"#333"},
          angleLines:{color:"#333"}
        }
      },
      plugins:{
        legend:{labels:{color:"#cccccc"}}
      }
    }
  });
}

// 填充页面数据
function fillPage(json) {
  if(!json.ok) {
    alert("数据加载失败："+json.msg);
    return;
  }
  const p = json.player;
  const s = json.stats;
  const list = json.matchesList;

  document.getElementById("avatarText").textContent = p.username.slice(0,2).toUpperCase();
  document.getElementById("playerName").textContent = p.username;
  document.getElementById("playerMeta").innerHTML = `
    <span>${p.server} | ${p.mode}</span>
    <span>${p.season}</span>
    <span class="text-orange-500 font-medium">${p.tier}</span>
  `;

  document.getElementById("statMatches").textContent = s.matches;
  document.getElementById("statWins").textContent = s.wins;
  document.getElementById("statWinRate").textContent = s.winRate+"%";
  document.getElementById("statAvgDmg").textContent = s.avgDamage;
  document.getElementById("statAvgKill").textContent = s.avgKill;

  renderRadar(json.radar);

  const tbody = document.getElementById("matchTableBody");
  tbody.innerHTML = "";
  list.forEach(row=>{
    const tr = document.createElement("tr");
    tr.className = "border-b border-[#282828] hover:bg-[#282828]";
    let rankText = row.rank === 1 ? `<span class="text-yellow-400">🥇 第1名</span>` : `第${row.rank}名`;
    tr.innerHTML = `
      <td class="py-3">${row.time}</td>
      <td class="text-center">${rankText}</td>
      <td class="text-center">${row.kills}</td>
      <td class="text-center">${row.damage}</td>
      <td class="text-center">${row.survive}</td>
    `;
    tbody.appendChild(tr);
  });
}

// 请求接口
function loadPlayerData(username) {
  fetch(`/api/playerData?username=${encodeURIComponent(username)}`)
    .then(res=>res.json())
    .then(json=>fillPage(json))
    .catch(err=>{
      console.error(err);
      alert("网络加载失败");
    });
}

window.onload = function(){
  // ========== 修改这里，初始加载目标玩家
  loadPlayerData("Yvainchuang");
};
</script>
</body>
</html>
